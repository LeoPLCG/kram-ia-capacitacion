<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Programa de Adopción de IA — KRAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16233F;
    --navy-light:#22335A;
    --verde:#1F7A5C;
    --verde-light:#E7F3EE;
    --dorado:#C87F2A;
    --dorado-light:#FBF0E2;
    --rojo:#B23A32;
    --rojo-light:#FBEAE8;
    --bg:#F7F7F5;
    --card:#FFFFFF;
    --line:#E4E2DC;
    --ink:#1B1F27;
    --ink-soft:#5B6270;
    --radius:14px;
    --shadow:0 2px 10px rgba(22,35,63,0.06), 0 10px 30px rgba(22,35,63,0.05);
    --maxw:1180px;
    font-family:'Manrope',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{line-height:1.55; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Archivo',system-ui,sans-serif; color:var(--navy); margin:0 0 .4em 0; letter-spacing:-0.01em;}
  h1{font-weight:800;} h2{font-weight:700;} h3{font-weight:700;} h4{font-weight:600;}
  p{margin:0 0 .9em 0;}
  a{color:var(--verde);}
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}
  @media (max-width:600px){.wrap{padding:0 18px;}}

  /* Topbar */
  .topbar{background:var(--card); border-bottom:1px solid var(--line);}
  .topbar .wrap{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; gap:16px; flex-wrap:wrap;}
  .topbar .brandline{display:flex; align-items:center; gap:18px;}
  .topbar img.logo-impulsa{height:34px; width:auto;}
  .topbar img.logo-lcg{height:20px; width:auto; opacity:.85;}
  .topbar .divider{width:1px; height:26px; background:var(--line);}
  .topbar .proginfo{text-align:right; font-size:12.5px; color:var(--ink-soft);}
  .topbar .proginfo strong{color:var(--navy); display:block; font-size:13.5px;}
  .admin-corner-btn{background:var(--navy); color:#fff; border:none; padding:9px 16px; border-radius:8px; font-size:12.5px; font-weight:700; white-space:nowrap;}
  .admin-corner-btn:hover{background:var(--navy-light);}

  /* Nav */
  nav.tabs{position:sticky; top:0; z-index:30; background:var(--navy); box-shadow:var(--shadow);}
  nav.tabs .wrap{display:flex; flex-wrap:wrap; gap:4px; padding:6px 20px;}
  nav.tabs button{background:transparent; border:none; color:#C7CEDD; padding:12px 15px; font-size:13.5px; font-weight:600; white-space:nowrap; border-bottom:3px solid transparent; border-radius:8px 8px 0 0; transition:.15s;}
  nav.tabs button:hover{color:#fff;}
  nav.tabs button.active{color:#fff; border-bottom-color:var(--dorado);}
  nav.tabs button .n{display:inline-block; background:rgba(255,255,255,.12); border-radius:6px; padding:1px 6px; margin-right:6px; font-size:11px;}

  main{min-height:60vh; padding:36px 0 70px 0;}

  /* Hero (home) */
  .hero{background:linear-gradient(135deg,var(--navy) 0%, #1D2E52 60%, var(--navy-light) 100%); color:#fff; padding:44px 36px 48px 36px; margin-bottom:40px;}
  @media (max-width:600px){.hero{padding:32px 20px;}}
  .hero h1{color:#fff; font-size:clamp(26px,4vw,38px); max-width:820px;}
  .hero p.lead{color:#D7DCE8; max-width:680px; font-size:16px;}
  .hero .pill{display:inline-block; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); color:#fff; font-size:12.5px; font-weight:600; padding:5px 12px; border-radius:100px; margin-bottom:16px;}

  .grid5{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-top:28px;}
  @media (max-width:900px){.grid5{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.grid5{grid-template-columns:1fr;}}
  .sesion-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16); border-radius:var(--radius); padding:16px; cursor:pointer; transition:.15s;}
  .sesion-card:hover{background:rgba(255,255,255,.12); transform:translateY(-2px);}
  .sesion-card .tag{font-size:11px; font-weight:700; color:var(--dorado); text-transform:uppercase; letter-spacing:.04em;}
  .sesion-card h4{color:#fff; font-size:15px; margin:6px 0 8px 0;}
  .sesion-card p{color:#C7CEDD; font-size:12.5px; margin:0;}

  /* Cards / sections */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px;}
  .section-title{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .section-title .dot{width:9px; height:9px; border-radius:50%; background:var(--verde);}
  .two-col{display:grid; grid-template-columns:1.6fr 1fr; gap:24px; align-items:start;}
  @media (max-width:900px){.two-col{grid-template-columns:1fr;}}
  .stack{display:flex; flex-direction:column; gap:20px;}

  /* Ladder */
  .ladder{display:grid; grid-template-columns:repeat(6,1fr); gap:8px;}
  @media (max-width:800px){.ladder{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:480px){.ladder{grid-template-columns:1fr;}}
  .rung{border-radius:10px; padding:12px 12px 14px 12px; border:1px solid var(--line); background:#FBFBF9; position:relative;}
  .rung .num{font-family:'Archivo',sans-serif; font-weight:800; font-size:18px; color:var(--ink-soft);}
  .rung h5{font-size:12.5px; font-weight:700; margin:4px 0 4px 0; color:var(--navy);}
  .rung p{font-size:11.5px; color:var(--ink-soft); margin:0;}
  .rung.covered{background:var(--verde-light); border-color:#BFE0D2;}
  .rung.covered .num{color:var(--verde);}
  .rung.touch{background:var(--dorado-light); border-color:#F0D3A8;}
  .rung.touch .num{color:var(--dorado);}
  .rung.preview{background:#F2F2F0; border-style:dashed;}
  .rung .badge{position:absolute; top:-9px; right:8px; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; padding:2px 7px; border-radius:100px; background:var(--verde); color:#fff;}
  .rung.touch .badge{background:var(--dorado);}
  .rung.preview .badge{background:#9AA0AC;}

  /* session header */
  .session-hero{background:var(--navy); color:#fff; border-radius:var(--radius); padding:26px 28px; margin-bottom:24px;}
  .session-hero .tag{color:var(--dorado); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;}
  .session-hero h2{color:#fff; margin-top:6px;}
  .session-hero p{color:#C7CEDD; max-width:680px; margin-bottom:0; font-size:14.5px;}
  .meta-row{display:flex; gap:18px; margin-top:16px; flex-wrap:wrap;}
  .meta-row .m{font-size:12px; color:#C7CEDD;}
  .meta-row .m strong{display:block; color:#fff; font-size:14px;}

  /* agenda */
  .agenda{display:flex; flex-direction:column; gap:0;}
  .agenda .item{display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--line);}
  .agenda .item:last-child{border-bottom:none;}
  .agenda .time{flex:0 0 56px; font-family:'Archivo',sans-serif; font-weight:800; color:var(--verde); font-size:13px;}
  .agenda .txt h5{margin:0 0 2px 0; font-size:13.5px; color:var(--navy);}
  .agenda .txt p{margin:0; font-size:12.5px; color:var(--ink-soft);}

  /* content blocks */
  .block{margin-bottom:22px;}
  .block h3{font-size:17px;}
  .block p{color:#333A44; font-size:14.5px;}
  .block ul{margin:0 0 .9em 0; padding-left:20px; color:#333A44; font-size:14.5px;}
  .block li{margin-bottom:4px;}

  /* video */
  .video-wrap{position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:10px; background:#000;}
  .video-wrap iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:0;}
  .video-note{font-size:11.5px; color:var(--ink-soft); margin-top:8px;}
  .video-note.warn{color:var(--rojo);}

  /* sidebar */
  .side-card{margin-bottom:18px;}
  .side-card h4{font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:12px;}

  /* quiz */
  .quiz-status{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; padding:6px 12px; border-radius:100px; margin-bottom:16px;}
  .quiz-status.locked{background:#F2F2F0; color:var(--ink-soft);}
  .quiz-status.open{background:var(--verde-light); color:var(--verde);}
  .quiz-status.closed{background:var(--rojo-light); color:var(--rojo);}
  .quiz-status.done{background:var(--dorado-light); color:var(--dorado);}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--navy); margin-bottom:6px;}
  .field input[type=text], .field select, .field textarea, .field input[type=file]{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-family:inherit; font-size:14px; background:#fff;}
  .field textarea{resize:vertical; min-height:80px;}
  .qcard{border:1px solid var(--line); border-radius:11px; padding:16px 16px 12px 16px; margin-bottom:14px; background:#FBFBF9;}
  .qcard .qtitle{font-size:14px; font-weight:700; color:var(--navy); margin-bottom:10px;}
  .opt{display:flex; align-items:flex-start; gap:8px; padding:7px 0; font-size:13.5px; cursor:pointer;}
  .opt input{margin-top:3px;}
  .btn{display:inline-block; background:var(--verde); color:#fff; border:none; padding:12px 22px; border-radius:9px; font-weight:700; font-size:14px;}
  .btn:hover{background:#186049;}
  .btn.secondary{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .helptext{font-size:12px; color:var(--ink-soft); margin-top:6px;}

  .result-panel{text-align:center; padding:26px 20px; border-radius:12px; background:var(--verde-light); border:1px solid #BFE0D2;}
  .result-panel .score{font-family:'Archivo',sans-serif; font-weight:800; font-size:44px; color:var(--verde);}
  .result-panel .score small{font-size:16px; font-weight:600;}
  .result-panel p{color:#2E4B41; margin:8px 0 0 0; font-size:13.5px;}
  .result-panel.low{background:var(--rojo-light); border-color:#EBC2BD;}
  .result-panel.low .score{color:var(--rojo);}

  .review{margin-top:20px; text-align:left;}
  .review .ritem{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid rgba(0,0,0,.06); font-size:13px;}
  .review .ritem .ok{color:var(--verde); font-weight:800;}
  .review .ritem .bad{color:var(--rojo); font-weight:800;}

  .banner{border-radius:11px; padding:16px 18px; font-size:13.5px; margin-bottom:20px;}
  .banner.info{background:#EEF2FA; color:var(--navy); border:1px solid #D7E0F2;}
  .banner.warn{background:var(--dorado-light); color:#7A4E14; border:1px solid #F0D3A8;}

  /* admin */
  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px;}
  @media (max-width:800px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px;}
  .stat .v{font-family:'Archivo',sans-serif; font-weight:800; font-size:26px; color:var(--navy);}
  .stat .l{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;}
  table.datatable{width:100%; border-collapse:collapse; font-size:13px;}
  table.datatable th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); border-bottom:2px solid var(--line); padding:8px 10px;}
  table.datatable td{padding:9px 10px; border-bottom:1px solid var(--line); color:#333A44;}
  table.datatable tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  .badge-pct{display:inline-block; padding:2px 9px; border-radius:100px; font-size:11.5px; font-weight:700;}
  .badge-pct.high{background:var(--verde-light); color:var(--verde);}
  .badge-pct.mid{background:var(--dorado-light); color:var(--dorado);}
  .badge-pct.low{background:var(--rojo-light); color:var(--rojo);}

  footer{background:var(--navy); color:#93A0BE; padding:26px 0; font-size:12px; text-align:center;}
  footer a{color:#C7CEDD;}

  .sr-only{position:absolute; width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

  /* ---------------- Slide deck (contenido en modo diapositivas) ---------------- */
  .deck-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .deck-head h3{margin:0;}
  .btn-present{display:inline-flex; align-items:center; gap:8px; background:var(--navy); color:#fff; border:none; padding:10px 18px; border-radius:9px; font-weight:700; font-size:13.5px;}
  .btn-present:hover{background:var(--navy-light);}
  .btn-present svg{width:15px; height:15px;}

  .slide-stack{display:flex; flex-direction:column; gap:16px;}
  .slide-card{border:1px solid var(--line); border-radius:12px; padding:24px 26px; background:#FDFDFC;}
  .slide-card .stag{font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--verde); margin-bottom:8px;}
  .slide-card h3{font-size:18px; margin-bottom:12px;}
  .slide-card p, .slide-card ul{font-size:14.5px; color:#333A44;}
  .slide-card li{margin-bottom:4px;}
  .slide-card .video-note{margin-top:8px;}
  .example-box{background:var(--verde-light); border:1px solid #BFE0D2; border-left:4px solid var(--verde); border-radius:8px; padding:14px 16px; margin-top:14px;}
  .example-box .ex-tag{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--verde); margin-bottom:6px;}
  .example-box p{margin:0; font-size:13.5px; color:#25453A;}
  .present-slide .example-box{background:rgba(31,122,92,.16); border-color:rgba(31,122,92,.4);}
  .present-slide .example-box p{color:#DCE9E3;}

  /* icono decorativo + recuadro "punto clave" — le dan más textura visual a las slides de puro texto */
  .c-icon{display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background:var(--verde-light); color:var(--verde); margin-bottom:12px;}
  .c-icon svg{width:20px; height:20px;}
  .present-slide .c-icon{background:rgba(255,255,255,.08); color:var(--dorado);}
  .clave-box{background:#FBF3E8; border:1px solid #EAD3AC; border-left:4px solid var(--dorado); border-radius:8px; padding:14px 16px; margin-top:14px; display:flex; gap:10px; align-items:flex-start;}
  .clave-box .cl-mark{flex:0 0 auto; width:20px; height:20px; color:var(--dorado); margin-top:1px;}
  .clave-box .cl-mark svg{width:20px; height:20px;}
  .clave-box .cl-body .cl-tag{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--dorado); margin-bottom:4px;}
  .clave-box .cl-body p{margin:0; font-size:13.5px; color:#4A3319; font-weight:600; line-height:1.5;}
  .present-slide .clave-box{background:rgba(200,127,42,.18); border-color:rgba(200,127,42,.45);}
  .present-slide .clave-box .cl-body p{color:#F3DDBB;}

  .claude-mark{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:7px; background:#D97757; flex:0 0 auto;}
  .claude-mark svg{width:13px; height:13px;}
  .claude-chip{display:inline-flex; align-items:center; gap:7px; background:#FBEDE7; color:#A6472C; font-weight:700; font-size:12px; padding:4px 11px 4px 6px; border-radius:100px; margin-bottom:10px;}
  .claude-chip .claude-mark{width:18px; height:18px; border-radius:6px;}
  .claude-chip .claude-mark svg{width:10px; height:10px;}

  /* timeline slide */
  .timeline{display:flex; flex-direction:column; margin-top:6px;}
  .timeline .t-item{display:flex; gap:16px; position:relative; padding-bottom:20px;}
  .timeline .t-item:last-child{padding-bottom:0;}
  .timeline .t-item .t-rail{display:flex; flex-direction:column; align-items:center; flex:0 0 auto;}
  .timeline .t-item .t-dot{width:11px; height:11px; border-radius:50%; background:var(--verde); border:2px solid #fff; box-shadow:0 0 0 2px var(--verde); margin-top:4px;}
  .timeline .t-item .t-line{flex:1; width:2px; background:var(--line); margin-top:4px;}
  .timeline .t-item:last-child .t-line{display:none;}
  .timeline .t-year{font-family:'Archivo',sans-serif; font-weight:800; color:var(--verde); font-size:13.5px; min-width:64px;}
  .timeline .t-body{padding-bottom:2px;}
  .timeline .t-body h5{margin:0 0 3px 0; font-size:14px; color:var(--navy);}
  .timeline .t-body p{margin:0; font-size:13px; color:var(--ink-soft);}

  /* tiers slide (familia de modelos Claude) */
  .tiers-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px;}
  @media (max-width:800px){.tiers-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:480px){.tiers-grid{grid-template-columns:1fr;}}
  .tier-card{border:1px solid var(--line); border-radius:11px; padding:16px 14px; background:#fff;}
  .tier-card h5{font-family:'Archivo',sans-serif; font-size:15px; margin:0 0 6px 0; color:var(--navy);}
  .tier-card p{font-size:12px; color:var(--ink-soft); margin:0;}
  .tier-card.highlight{background:var(--verde-light); border-color:#BFE0D2;}
  .tier-card.highlight h5{color:var(--verde);}
  .tier-card .tpill{display:inline-block; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; background:var(--verde); color:#fff; padding:2px 8px; border-radius:100px; margin-bottom:8px;}

  /* cover slide (Inicio) */
  .cover-slide{text-align:left;}
  .cover-slide h2{font-size:clamp(22px,3vw,30px); margin-bottom:10px;}
  .cover-slide p{font-size:14.5px; color:#333A44;}

  /* video facade */
  .video-facade{position:relative; cursor:pointer; border-radius:10px; overflow:hidden; background:#0B1220; aspect-ratio:16/9;}
  .video-facade img{width:100%; height:100%; object-fit:cover; display:block; opacity:.85;}
  .video-facade .playbtn{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:64px; height:64px; border-radius:50%; background:rgba(178,58,50,.92); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(0,0,0,.35);}
  .video-facade .playbtn svg{width:22px; height:22px; margin-left:3px;}
  .video-facade:hover .playbtn{background:var(--rojo);}
  .video-facade .video-chip{position:absolute; right:10px; bottom:10px; background:rgba(11,18,32,.88); color:#fff; font-size:11px; font-weight:700; padding:5px 9px; border-radius:999px; letter-spacing:.01em;}
  .video-external-link{display:inline-block; margin-top:8px; font-size:12.5px; font-weight:700; color:var(--verde);}
  .video-external-link:hover{text-decoration:underline;}
  .present-slide .video-external-link{color:#8FE0BE;}

  /* tabla dentro de una slide de contenido (ej. versiones de modelos Claude) */
  .content-table-wrap{overflow-x:auto; margin-top:14px; border:1px solid var(--line); border-radius:10px;}
  .content-table{width:100%; border-collapse:collapse; font-size:13px;}
  .content-table th{background:#F3F2EE; text-align:left; padding:9px 12px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); border-bottom:1px solid var(--line);}
  .content-table td{padding:10px 12px; border-bottom:1px solid var(--line); color:#333A44; vertical-align:top;}
  .content-table tr:last-child td{border-bottom:none;}
  .present-slide .content-table-wrap{border-color:rgba(255,255,255,.16);}
  .present-slide .content-table th{background:rgba(255,255,255,.06); color:#B8C0D6; border-bottom-color:rgba(255,255,255,.16);}
  .present-slide .content-table td{color:#DCE1EE; border-bottom-color:rgba(255,255,255,.1); font-size:clamp(13px,1.3vw,15px);}

  /* Presentation mode overlay */
  .present-overlay{position:fixed; inset:0; background:var(--navy); z-index:1000; display:flex; flex-direction:column; color:#fff;}
  .present-top{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; flex:0 0 auto;}
  .present-top .ptag{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#9AA6C2;}
  .present-lcg-logo{height:18px; width:auto; opacity:.9;}
  .present-close{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); color:#fff; padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600;}
  .present-close:hover{background:rgba(255,255,255,.2);}
  .present-body{flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:20px 60px; overflow:auto;}
  .present-slide{max-width:900px; width:100%;}
  .present-slide .stag{color:var(--dorado); font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; margin-bottom:14px;}
  .present-slide h2{color:#fff; font-size:clamp(24px,3.6vw,40px); margin-bottom:18px;}
  .present-slide p{color:#DCE1EE; font-size:clamp(15px,1.6vw,19px); line-height:1.6;}
  .present-slide ul{color:#DCE1EE; font-size:clamp(15px,1.6vw,19px); line-height:1.7; padding-left:24px;}
  .present-slide .timeline .t-year{color:var(--dorado);}
  .present-slide .timeline .t-body h5{color:#fff;}
  .present-slide .timeline .t-body p{color:#B8C0D6; font-size:14.5px;}
  .present-slide .tier-card{background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.14);}
  .present-slide .tier-card h5{color:#fff;}
  .present-slide .tier-card p{color:#B8C0D6;}
  .present-slide .tier-card.highlight{background:rgba(31,122,92,.22); border-color:rgba(31,122,92,.5);}
  .present-slide .tier-card.highlight h5{color:#6FD3AE;}
  .present-slide .agenda .item{border-bottom-color:rgba(255,255,255,.12);}
  .present-slide .agenda .time{color:var(--dorado);}
  .present-slide .agenda .txt h5{color:#fff;}
  .present-slide .agenda .txt p{color:#B8C0D6;}
  .present-slide .claude-chip{background:rgba(217,119,87,.18); color:#F0A283;}
  .present-slide .rung{background:rgba(255,255,255,.04); border-color:rgba(255,255,255,.14);}
  .present-slide .rung .num{color:#8D97B2;}
  .present-slide .rung h5{color:#fff;}
  .present-slide .rung p{color:#B8C0D6;}
  .present-slide .rung.covered{background:rgba(31,122,92,.22); border-color:rgba(31,122,92,.5);}
  .present-slide .rung.covered .num{color:#6FD3AE;}
  .present-slide .rung.touch{background:rgba(200,127,42,.2); border-color:rgba(200,127,42,.5);}
  .present-slide .rung.touch .num{color:var(--dorado);}
  .present-slide .rung.preview{background:rgba(255,255,255,.02); border-style:dashed;}
  .present-bottom{flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:18px; padding:18px 28px 26px 28px;}
  .present-nav-btn{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); color:#fff; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px;}
  .present-nav-btn:hover{background:rgba(255,255,255,.2);}
  .present-nav-btn:disabled{opacity:.3;}
  .present-dots{display:flex; gap:7px;}
  .present-dots .pd{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.25);}
  .present-dots .pd.active{background:var(--dorado); width:22px; border-radius:5px;}
  .present-counter{color:#9AA6C2; font-size:12.5px; min-width:52px; text-align:center;}

  /* Ejercicios aplicados */
  .ejercicio-card{border:1px solid var(--line); border-left:4px solid var(--verde); border-radius:10px; padding:18px 20px 16px; margin-bottom:18px;}
  .ejercicio-card:last-child{margin-bottom:0;}
  .ej-num{font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--verde); margin-bottom:5px;}
  .ej-titulo{font-size:15px; font-weight:700; margin:0 0 8px 0; color:var(--ink);}
  .ej-objetivo{font-size:13px; color:var(--ink-soft); margin:0 0 14px 0; line-height:1.55;}
  .ej-steps-label{font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--ink-soft); margin:0 0 7px 0;}
  .ej-pasos{margin:0 0 16px 0; padding-left:20px;}
  .ej-pasos li{font-size:13.5px; margin-bottom:7px; line-height:1.55;}
  .prompt-box{background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .prompt-header{display:flex; align-items:center; justify-content:space-between; padding:9px 14px; background:var(--verde);}
  .prompt-label{font-size:12px; font-weight:700; color:#fff;}
  .copy-btn{background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.4); color:#fff; font-size:11.5px; font-weight:700; padding:4px 13px; border-radius:5px; cursor:pointer; transition:.15s;}
  .copy-btn:hover{background:rgba(255,255,255,.38);}
  .copy-btn.copied{background:#fff; color:var(--verde);}
  .prompt-text{margin:0; padding:14px 16px; font-family:inherit; font-size:12.5px; line-height:1.65; white-space:pre-wrap; color:var(--ink); max-height:280px; overflow-y:auto;}
</style>
</head>

  contenido:[
    {h:"¿Por qué esto importa para KRAM?", icon:"lightbulb", p:[
      "En KRAM ya se usa inteligencia artificial todos los días, aunque sea de forma informal: alguien que le pide a ChatGPT ayuda para redactar un correo o resumir un reporte. Este programa no parte de cero — parte de ahí, y lo convierte en una forma de trabajo consistente para el personal de KRAM seleccionado para este programa.",
      "Comercializadora KRAM vive de decisiones rápidas y repetitivas: revisar qué se vendió en una tienda, redactar un reporte para un supervisor, resumir lo que reportó un cliente, decidir qué producto reponer primero, describir una incidencia de inventario. Cada una de esas tareas se puede apoyar con IA — no para reemplazar el criterio de quien la hace, sino para llegar a la decisión invirtiendo menos tiempo en juntar y ordenar información.",
      "Este programa parte de una premisa simple: no hace falta ser programador ni \"de sistemas\" para usar bien la IA. Es, ante todo, una herramienta de lenguaje. Si sabes explicarle una tarea a una persona nueva en el equipo, ya tienes recorrida buena parte del camino para saber pedírsela a un modelo de IA."
    ], clave:"No se trata de reemplazar el criterio de nadie: se trata de llegar a la misma decisión invirtiendo menos tiempo en juntar y ordenar información."},
    {h:"De las reglas fijas a la IA generativa", icon:"forward", p:[
      "La inteligencia artificial no nació ayer. Empezó con sistemas de reglas fijas (\"si pasa X, haz Y\"), luego aprendió a encontrar patrones en datos (Machine Learning), después a reconocer imágenes y voz con más profundidad (Deep Learning), y hoy puede generar texto, imágenes y código nuevos (IA Generativa). El siguiente paso, que apenas está arrancando, son los agentes: sistemas que no solo generan una respuesta, sino que actúan.",
      "Para dimensionarlo con un ejemplo cercano: un sistema de reglas fijas es como una alarma de tienda que suena si un sensor detecta que algo cruzó la puerta sin pasar por caja — siempre la misma regla, sin importar el contexto. El Machine Learning es más parecido a un sistema que, después de ver miles de tickets de venta históricos, aprende a estimar qué producto es más probable que se agote esta semana en una tienda determinada — encuentra el patrón, pero solo entrega un número o una categoría. La IA generativa —la que usamos en este programa— va un paso más allá: no solo predice, puede redactar el reporte completo, generar la imagen de un exhibidor o proponer el texto de un mensaje para un supervisor, a partir de una instrucción en lenguaje natural.",
      "El siguiente escalón — los agentes, que además de generar contenido pueden usar herramientas y actuar por varios pasos — es el tema central de la Sesión 2."
    ], clave:"Reglas fijas → Machine Learning → IA generativa → Agentes: cada escalón puede hacer más de forma independiente. Los agentes son el tema de la Sesión 2."},
    {h:"¿Qué es un LLM?", icon:"cpu", p:[
      "LLM significa \"Large Language Model\", o Modelo de Lenguaje Grande. Es el motor detrás de Claude, ChatGPT y herramientas similares. En términos simples: es un modelo entrenado con enormes cantidades de texto que aprendió a predecir, palabra por palabra, cuál es la continuación más probable de lo que le estás escribiendo. No \"sabe\" las cosas como una persona; reconoce patrones de lenguaje con muchísima precisión.",
      "Una forma útil de imaginarlo: es como si hubiera leído una cantidad casi inimaginable de texto —libros, manuales, artículos, conversaciones— y, a partir de esa lectura, se volvió excelente prediciendo qué palabra sigue de forma coherente con el estilo, el tema y el contexto que le diste. De ahí se desprenden dos consecuencias prácticas para el día a día: primero, entre más claro y completo sea el contexto que le das, mejor va a ser su respuesta — por eso importa cómo se pide algo, no solo qué se pide. Segundo, un LLM puede \"sonar\" muy seguro de sí mismo incluso cuando se equivoca (a esto se le suele llamar una \"alucinación\"): cualquier dato crítico —una cifra de venta, el nombre exacto de un producto, una fecha de vigencia— siempre debe verificarse contra la fuente original antes de usarse para tomar una decisión."
    ], clave:"Un LLM predice texto con muchísima precisión, pero puede sonar seguro incluso al equivocarse — todo dato crítico se verifica contra la fuente."},
    {h:"¿Qué es un token?", icon:"hash", p:[
      "Un token es la unidad mínima de texto que el modelo procesa: puede ser una palabra completa, parte de una palabra o un signo de puntuación. Una palabra como \"Promotoría\" puede dividirse en más de un token. Esto importa porque el costo, la velocidad y la cantidad de información que un modelo puede manejar de una sola vez se miden en tokens, no en palabras.",
      "Como referencia práctica: una palabra corta y común suele ser un solo token, mientras que una palabra larga o poco frecuente —el nombre de una marca poco común, por ejemplo— puede dividirse en dos o tres. Esto tiene dos implicaciones para el uso diario. Primero, cuando pegas un documento muy largo (un reporte de venta de varias tiendas, por ejemplo) estás usando muchos tokens de una sola vez, y todo modelo tiene un límite de tokens que puede procesar en una sola conversación. Segundo, si una conversación se alarga demasiado, el modelo puede empezar a \"perder de vista\" el contexto del inicio — por eso conviene ser conciso y, cuando el tema cambie por completo, abrir una conversación nueva en lugar de seguir acumulando todo en la misma."
    ], clave:"Los tokens miden cuánto texto puede procesar el modelo a la vez: sé conciso y abre una conversación nueva cuando cambie el tema."},
    {h:"El prompt: la instrucción que le das a la IA", icon:"chat", p:[
      "El prompt es simplemente lo que le escribes al modelo. Un prompt vago (\"hazme un resumen\") da resultados vagos. Un prompt con contexto, rol y formato deseado da resultados útiles.",
      "Piensa en el prompt como el equivalente a darle una instrucción de trabajo a una persona nueva en el equipo: entre más contexto, ejemplos y formato esperado le des, menos tiempo vas a invertir corrigiendo el resultado después. En las próximas sesiones vamos a practicar esto con ejemplos reales de Comercializadora KRAM."
    ], ejemplo:{titulo:"Antes y después de un prompt", texto:"Débil: \"Hazme un resumen de ventas.\" — Mejor: \"Actúa como analista de Promotoría. Con base en este reporte de venta semanal de 5 tiendas [adjunto], dime cuáles 3 tiendas tuvieron la mayor caída de venta contra la semana anterior, y entrégamelo en una tabla de 3 columnas: tienda, % de caída, posible causa.\""}},
    {h:"La escalera de niveles de conocimiento de Claude", icon:"stairs", p:[
      "A lo largo de este programa vamos a subir, peldaño a peldaño, por una escalera de seis niveles que sirve como mapa de referencia. Hoy, la mayoría del equipo está en el Nivel 1: usar el chat de forma suelta. Estas cinco sesiones los llevan de forma práctica hasta el Nivel 5.",
      "El Nivel 6 —agentes trabajando de principio a fin— no es parte del entrenamiento práctico de este programa: se menciona brevemente en la última sesión únicamente como contexto, para que el equipo entienda hacia dónde puede evolucionar la industria a futuro. Es importante que quede claro: este programa capacita al equipo hasta un nivel básico-intermedio (Niveles 1 a 5), no hasta el Nivel 6.",
      "En la próxima sesión bajamos un peldaño más concreto: qué es exactamente un agente, en qué se diferencia de simplemente chatear con un modelo, y por qué la distinción entre \"automatización\" y \"autonomía\" es la más importante que vas a aprender en todo el programa."
    ], clave:"Este programa capacita del Nivel 1 al Nivel 5 de forma práctica. El Nivel 6 se menciona solo como referencia — no es una meta de este programa."},
    {h:"Las versiones de los modelos de Claude", icon:"layers", p:[
      "Claude no es un solo modelo: es una familia de modelos con distintos niveles de capacidad, velocidad y costo. Elegir el modelo correcto para cada tarea es, en sí mismo, una habilidad práctica — usar siempre el más potente no es lo más eficiente, ni tampoco lo más rápido.",
      "La tabla siguiente resume la familia actual y, de forma orientativa, qué tan intensivo es el uso de tokens de cada uno (a mayor capacidad de razonamiento, generalmente mayor consumo de tokens por respuesta, y por lo tanto más costo y más tiempo de espera)."
    ], tabla:{
      headers:["Modelo", "Para qué sirve", "Intensidad de uso de tokens"],
      rows:[
        ["Claude Haiku", "Tareas simples, rápidas y de alto volumen: clasificar, resumir textos cortos, respuestas inmediatas.", "Baja"],
        ["Claude Sonnet", "El balance por defecto: la gran mayoría del trabajo diario de análisis, redacción y reportes.", "Media"],
        ["Claude Opus", "Trabajo agéntico complejo y tareas más exigentes de análisis o código.", "Alta"],
        ["Claude Fable", "El nivel más capaz: razonamiento profundo y agentes de larga duración, para los problemas más demandantes.", "Muy alta"]
      ]
    }, clave:"A mayor capacidad del modelo, generalmente mayor uso de tokens: usa el nivel más alto solo cuando la tarea realmente lo exija."},
    {h:"Caso aplicado real: la minuta de la junta semanal para el CEO", icon:"chat", p:[
      "Un caso muy común en cualquier puesto administrativo: después de la junta semanal, alguien tiene que convertir las notas —muchas veces desordenadas— en una minuta clara, con acuerdos y responsables, lista para enviarse al CEO. Este es un ejemplo de principio a fin de cómo resolverlo con Claude, pensado para que el resultado se pueda copiar y pegar directo en el cuerpo de un correo."
    ], ul:[
      "Reúne tus notas de la junta (a mano, grabación transcrita, o notas sueltas del chat) — no necesitan estar ordenadas; cópialas y pégalas tal cual en la conversación con Claude.",
      "Dale contexto y rol: indícale que actúe como tu asistente de dirección, que la minuta es para el CEO de Comercializadora KRAM, y qué información no puede faltar (fecha, asistentes, acuerdos, responsable de cada acuerdo, fecha compromiso).",
      "Pide el formato exacto de salida: un resumen ejecutivo de 3 o 4 líneas al inicio, seguido de una tabla con columnas Acuerdo, Responsable y Fecha compromiso.",
      "Revisa el resultado contra tus notas originales — cualquier nombre, cifra o fecha crítica se verifica antes de enviarla, como vimos antes en esta misma sesión.",
      "Copia el resultado y pégalo directo en el cuerpo de tu correo al CEO — si le pediste el formato correcto desde el prompt, no hace falta reacomodar nada."
    ], ejemplo:{titulo:"Prompt listo para copiar y pegar", texto:"\"Actúa como mi asistente de dirección. Aquí están mis notas de la junta semanal de Comercializadora KRAM del [fecha] [pega tus notas]. Redacta una minuta ejecutiva para el CEO con: 1) un resumen de 3 líneas del estado general, 2) una tabla con columnas Acuerdo, Responsable y Fecha compromiso, y 3) los pendientes de la semana anterior que sigan abiertos. Usa un tono formal y directo, listo para copiar y pegar en el cuerpo de un correo.\""}}
  ],

{
  id:2, slug:"sesion-2",
  titulo:"De la IA a los Agentes: el vocabulario que necesitas",
  navLabel:"De la IA a los Agentes",
  objetivo:"Al terminar, cada participante distingue automatización de autonomía, explica qué es un agente de IA, y sale con un prompt propio bien estructurado.",
  ladderFocus:[1,2], ladderPreview:[5],
  agenda:[
    {t:5,  titulo:"Repaso relámpago", desc:"Lo esencial de la Sesión 1."},
    {t:15, titulo:"Automatización vs. autonomía", desc:"La distinción que cambia todo."},
    {t:10, titulo:"¿Qué es un agente de IA?", desc:"Diferencia entre conversar y actuar."},
    {t:10, titulo:"Contexto y memoria", desc:"Por qué \"recordar\" importa."},
    {t:10, titulo:"Claude vs. el chat que ya usan", desc:"Misma tecnología, uso distinto."},
    {t:10, titulo:"Cómo armar un buen prompt", desc:"Contexto, rol, tarea y formato."},
    {t:5,  titulo:"Cierre", desc:"Instrucciones del quiz."}
  ],
  contenido:[
    {h:"Automatización vs. autonomía", icon:"shuffle", p:[
      "Una automatización sigue un guion fijo: si ocurre A, siempre hace B, sin importar el contexto. Un agente autónomo, en cambio, evalúa la situación y decide qué hacer en el momento, dentro de los límites que tú definiste. Confundir estos dos términos es de los errores más comunes en el mercado — y es clave distinguirlos antes de hablar de \"agentes\".",
      "Un ejemplo del día a día de KRAM ayuda a fijar la idea: una automatización sería \"si el inventario de una tienda baja de 10 piezas, envía siempre el mismo correo de reabastecimiento\" — pase lo que pase, ese es el único camino posible. Un agente autónomo, en cambio, podría revisar el inventario, cruzarlo contra el histórico de venta de esa tienda en particular, considerar si hay una promoción activa esa semana, y decidir si conviene reabastecer, esperar, o avisar a un supervisor primero — todo dentro de reglas que una persona definió de antemano.",
      "Ninguna de las dos es \"mejor\" en abstracto: la automatización es más predecible y más fácil de auditar; la autonomía es más flexible pero exige más cuidado en cómo se supervisa. Este programa no busca que el equipo construya agentes complejos — busca que entiendan la diferencia para usar bien las herramientas que ya existen y para participar con criterio en decisiones futuras sobre este tema."
    ], clave:"Automatización = mismo camino siempre. Autonomía = decide según el contexto, dentro de límites que tú defines."},
    {h:"¿Qué es un agente de IA?", icon:"bolt", p:[
      "Un agente es un sistema que puede usar herramientas (buscar información, leer un archivo, escribir en una hoja de cálculo) para completar una tarea de varios pasos, no solo para responder una pregunta. Un chat normal conversa contigo; un agente actúa por ti, dentro de las reglas que le diste.",
      "La diferencia se nota en el resultado: si le pides a un chat normal \"dime cómo estructurar un reporte de venta semanal\", te va a explicar cómo hacerlo — pero tú tienes que ejecutarlo. Si un agente tiene acceso a la hoja de cálculo real y a la instrucción de generar el reporte, puede leer los datos, hacer los cálculos, redactar las conclusiones y entregarte el documento terminado, sin que tengas que copiar y pegar cada paso. Ese salto —de \"me explica qué hacer\" a \"lo hace\"— es exactamente lo que separa un asistente de un agente."
    ], clave:"Un chat te explica qué hacer; un agente lo hace por ti, dentro de las reglas que le diste."},
    {h:"Contexto y memoria: por qué \"recordar\" importa", icon:"layers", p:[
      "Cada modelo tiene una \"ventana de contexto\": la cantidad de información que puede tener presente en una conversación. Guardar el contexto de KRAM (marcas, estructura de Promotoría, formatos de reporte) en un Proyecto de Claude evita tener que explicarlo desde cero cada vez que alguien lo usa.",
      "Piénsalo como la diferencia entre explicarle la operación de KRAM a alguien por primera vez cada lunes, versus tener a alguien que ya conoce la estructura de supervisores, las cadenas con las que trabajan, y el formato de reporte que usa Jefatura — y que simplemente necesita los datos de esta semana para trabajar. Un Proyecto de Claude cumple ese segundo rol: uno lo configura una vez con el contexto que casi no cambia, y cada conversación nueva dentro de ese Proyecto ya parte de ahí."
    ], clave:"Un Proyecto de Claude guarda el contexto de KRAM una sola vez, para no tener que reexplicarlo en cada conversación."},
    {h:"Claude vs. el chat que ya usan", icon:"swap", p:[
      "Claude y ChatGPT son la misma familia de tecnología (LLMs), y quienes en el equipo ya usan IA en su día a día no están partiendo de cero. La diferencia práctica que vamos a explotar en este programa está en cómo Claude organiza el contexto de largo plazo (Proyectos), cómo genera piezas visuales editables (Claude Design, Sesión 3) y cómo se conecta a herramientas de trabajo (Sesión 4).",
      "En otras palabras: si alguien del equipo ya sabe pedirle cosas a ChatGPT, ese hábito no se pierde — se traslada. Lo que cambia es la profundidad de lo que se puede hacer sin salir de la conversación: guardar contexto que persiste entre sesiones, producir un documento visual terminado en vez de solo texto, y —más adelante— conectar la IA directamente a herramientas como el correo o Google Drive."
    ], clave:"Ningún hábito se pierde al pasar de ChatGPT a Claude — se traslada, y gana profundidad con Proyectos, Claude Design y conectores."},
    {h:"¿Qué es Cowork?", icon:"briefcase", p:[
      "Cowork es el modo de Claude pensado para automatizar tareas de trabajo con archivos y proyectos completos, no solo para conversar. En vez de solo responder preguntas, dentro de Cowork Claude puede leer y escribir archivos, generar documentos y hojas de cálculo, usar herramientas conectadas (como los conectores que veremos en la Sesión 4), y ejecutar tareas de varios pasos de principio a fin.",
      "Es la diferencia entre platicar con la IA sobre un reporte, y pedirle que te entregue el reporte terminado, con los archivos correctos y listos para usarse."
    ], clave:"Cowork lleva a Claude de responder preguntas a producir y entregar el trabajo completo: archivos, documentos y tareas de varios pasos."},
    {h:"¿Qué es una skill?", icon:"repeat", p:[
      "Una skill es un conjunto de instrucciones guardadas que le indican a Claude exactamente cómo resolver un tipo de tarea específico, siempre de la misma forma, sin tener que reexplicarla cada vez.",
      "En la Sesión 3 vamos a ver una skill aplicada a Claude Design, pero el concepto es más general: cualquier tarea repetitiva y bien definida —redactar un reporte con cierto formato, seguir una checklist de revisión, aplicar siempre el mismo criterio de evaluación— se puede convertir en una skill, para que el equipo completo la use de forma consistente."
    ], clave:"Una skill convierte una tarea repetitiva en un procedimiento que Claude sigue siempre igual, sin que nadie tenga que reexplicarlo cada vez."},
    {h:"¿Qué son las rutinas en Claude?", icon:"clock", p:[
      "Una rutina es, en esencia, un agente al que le pones un horario: en vez de que una persona abra la conversación y pida algo, la rutina se dispara sola en el momento definido —una sola vez, o de forma recurrente— y ejecuta la instrucción que se dejó preparada, sin que nadie tenga que estar presente.",
      "Esto trae una exigencia particular: como nadie va a estar ahí para aclarar dudas en el momento, la instrucción debe quedar completa y sin ambigüedad desde que se configura la rutina, no durante una conversación de ida y vuelta como el chat normal."
    ], ul:[
      "Un disparador o horario: cuándo se ejecuta (una fecha específica, o de forma recurrente cada día, semana, etc.).",
      "La instrucción o tarea que debe realizar cada vez que se dispara, escrita de forma completa y autosuficiente.",
      "Opcionalmente, a qué herramientas, archivos o cuentas tiene acceso mientras corre, y cómo debe avisar cuando termina (por ejemplo, una notificación o un correo)."
    ], clave:"Una rutina es un agente con horario propio: se configura una vez y se ejecuta sola, con una instrucción completa desde el inicio porque nadie va a estar ahí para aclarársela."},
    {h:"Cómo armar un buen prompt", icon:"chat", p:[
      "Un buen prompt casi siempre tiene cuatro partes: contexto (qué información relevante le das), rol (desde qué perspectiva quieres la respuesta), tarea (qué necesitas exactamente) y formato (cómo quieres el resultado). No hace falta memorizar una fórmula rígida — basta con preguntarte, antes de escribir: \"¿le estoy dando a esto la misma claridad que le daría a una persona nueva en mi equipo?\""
    ], ejemplo:{titulo:"Las cuatro partes en un solo prompt", texto:"\"Eres analista de Promotoría en KRAM [rol]. Aquí está el reporte de venta de la semana de 5 tiendas de la zona sur [contexto/adjunto]. Identifica los 3 SKU con mayor caída de venta versus la semana anterior [tarea] y entrégamelo en una tabla de 3 columnas: SKU, % de caída, posible causa [formato].\""}},
    {h:"Herramientas complementarias para resultados más robustos", icon:"toolbox", p:[
      "Todo lo visto hasta ahora funciona directamente dentro de Claude, sin instalar nada. Pero cuando un resultado necesita ir un paso más allá —convertirse en una aplicación real, guardar datos de verdad, o publicarse para que otros lo usen— existen herramientas complementarias que se conectan bien con el trabajo ya hecho con la IA. Este mismo programa de capacitación es un ejemplo: se construyó con Claude, pero se publicó y se conecta a una base de datos real usando varias de estas herramientas."
    ], ul:[
      "Visual Studio Code (VS Code) — el editor de código más usado; permite abrir, revisar y ajustar con más control los archivos que la IA genera, antes de usarlos en producción.",
      "GitHub — guarda versiones del trabajo, permite compartirlo con otros, y es la forma más común de publicar una página o herramienta para que cualquiera con el link la use (como se hizo con el sitio de este programa).",
      "Vercel — un servicio para publicar páginas y aplicaciones web en internet en minutos, sin tener que configurar un servidor.",
      "Supabase — una base de datos en la nube lista para usar; permite que una herramienta hecha con IA guarde información real (como las respuestas de los quizes de este programa) y la consulte después."
    ], clave:"Estas herramientas son fáciles de empezar a usar, pero el resultado sigue dependiendo de tener contexto claro y una estructura bien pensada — la herramienta no reemplaza el criterio de quien la usa."}
  ],

  quiz:[
    {q:"La diferencia clave entre automatización y autonomía es:", opts:["No hay diferencia real","La automatización sigue reglas fijas predefinidas; la autonomía decide en tiempo real según el contexto","La autonomía siempre es más lenta","La automatización usa IA y la autonomía no"], correct:1},
    {q:"Un agente de IA se diferencia de un simple chat porque:", opts:["Es más caro","Puede tomar acciones y usar herramientas para completar una tarea, no solo responder texto","No necesita instrucciones","Solo funciona sin internet"], correct:1},
    {q:"¿Qué significa que un humano esté \"human-in-the-loop\"?", opts:["Que la IA trabaja sola sin supervisión","Que una persona revisa o aprueba las acciones antes de que sean definitivas","Que solo los humanos pueden usar la IA","Que el humano programa el modelo"], correct:1},
    {q:"La \"ventana de contexto\" de un modelo se refiere a:", opts:["La pantalla donde se usa el chat","La cantidad de información que el modelo puede tener presente y usar en una conversación","El horario en que funciona la IA","El tamaño del archivo de imagen"], correct:1},
    {q:"Guardar el contexto de KRAM en un \"Proyecto\" de Claude sirve para:", opts:["Borrar el historial","Que la IA no tenga que volver a preguntar el mismo contexto cada vez","Cambiar de idioma","Reducir el número de usuarios"], correct:1},
    {q:"¿Cuál de estos es un ejemplo de prompt bien estructurado para el trabajo diario en KRAM?", opts:["“Ayuda”","“Con base en este reporte de venta semanal, resume los 3 SKU con mayor caída de venta por tienda y sugiere una acción”","“Hazme un resumen”","“Información”"], correct:1},
    {q:"¿Qué es Cowork?", opts:["Un modelo de Claude","El modo de Claude pensado para automatizar tareas de trabajo con archivos y proyectos completos, no solo conversar","Un tipo de conector","Una skill predefinida"], correct:1},
    {q:"Una skill en Claude sirve para:", opts:["Cambiar el idioma del modelo","Convertir una tarea repetitiva en un procedimiento que Claude sigue siempre de la misma forma","Bloquear el acceso a internet","Aumentar el límite de tokens"], correct:1},
    {q:"Una \"rutina\" en Claude es, en esencia:", opts:["Un reporte fijo que nunca cambia","Un agente al que le pones un horario, para que se ejecute solo sin que nadie esté presente","Un tipo de prompt corto","Una función exclusiva de Claude Design"], correct:1},
    {q:"Herramientas como GitHub, Vercel o Supabase sirven para:", opts:["Reemplazar por completo el criterio de quien las usa","Llevar un resultado hecho con IA un paso más allá (publicarlo, guardar datos reales, versionarlo) — pero siguen dependiendo de contexto y estructura","Sustituir a Claude por completo","Nada relevante para este programa"], correct:1}

  contenido:[
    {h:"¿Qué es Claude Design?", icon:"palette", p:[
      "Es la herramienta dentro de Claude para crear piezas visuales completas y editables —no solo texto— a partir de una instrucción: fichas de producto, gráficos para exhibidores, calendarios de visita, señalética de punto de venta, infografías de proceso. El resultado no es una imagen fija: cada elemento se puede ajustar después.",
      "La diferencia con pedirle una imagen a un generador normal es clave: ahí obtienes una imagen \"cerrada\" que, si algo está mal —un color, un texto, una proporción— casi siempre hay que regenerar desde cero, con el riesgo de que salga distinto. En Claude Design, cada texto, cada color y cada bloque de la pieza queda como un elemento independiente que se puede seleccionar y ajustar después, igual que en un editor de diseño tradicional, pero habiendo partido de una instrucción en lenguaje natural en vez de un lienzo en blanco."
    ], clave:"A diferencia de una imagen \"cerrada\", cada elemento de una pieza en Claude Design se puede seleccionar y ajustar después."},
    {h:"Casos de uso para Comercializadora KRAM", icon:"grid", p:[
      "Estos son ejemplos concretos de piezas que se pueden resolver en minutos, sin depender de un diseñador para cada ajuste menor:"
    ], ul:[
      "Ficha técnica de un producto nuevo para capacitar al equipo de tienda (ingredientes, presentación, precio sugerido, argumento de venta).",
      "Gráfico de acomodo sugerido de anaquel, para explicarle a un promotor cómo debería verse la exhibición.",
      "Señalética o material POP para una exhibición temporal o de temporada.",
      "Calendario visual de visitas por supervisor, para que cada equipo sepa qué tienda le toca y cuándo.",
      "Infografía de un proceso interno de CEDIS (por ejemplo, los pasos para recibir y verificar un pedido)."
    ]},
    {h:"De la instrucción al diseño: buenas prácticas", icon:"sliders", p:[
      "Entre más claro seas sobre el estilo (colores, tono, tamaño), la marca y el objetivo de la pieza, mejor el primer resultado. Por ejemplo: “usa navy #16233F y verde #1F7A5C, estilo limpio, pensado para imprimirse y pegarse en un anaquel de autoservicio.”",
      "También ayuda decir para quién es la pieza y dónde se va a usar: no es lo mismo un gráfico pensado para proyectarse en una pantalla en una junta, que uno pensado para imprimirse tamaño carta y pegarse en un anaquel. Entre más contexto de uso le des, menos ajustes vas a necesitar después — y, como con cualquier instrucción, siempre puedes pedirle una segunda versión (\"hazla más simple\", \"usa menos texto\", \"agranda el precio\") en vez de empezar de cero."
    ], clave:"Entre más claro seas sobre estilo, marca, público y uso de la pieza, menos ajustes vas a necesitar después."},
    {h:"Skills: instrucciones que se guardan y se reutilizan", icon:"repeat", p:[
      "Una skill es un conjunto de instrucciones guardadas para repetir una tarea siempre de la misma forma, sin tener que reexplicarla cada vez. Es el mismo principio que un formato o una plantilla, pero aplicado a instrucciones para la IA.",
      "Por ejemplo: si cada semana alguien del equipo genera una ficha de producto con la misma estructura (nombre, categoría, presentación, precio sugerido, argumento de venta), esa estructura se puede guardar como una skill una sola vez. De ahí en adelante, basta con darle los datos del producto nuevo y la IA sigue automáticamente ese mismo formato — sin que cada persona del equipo tenga que reinventar la instrucción por su cuenta."
    ], clave:"Una skill se configura una sola vez y de ahí en adelante todo el equipo sigue el mismo formato, sin reinventar la instrucción."}

      num:1,
      titulo:"Benchmark de mercado en presentación",
      objetivo:"Genera un análisis ejecutivo de la categoría de confitería y chocolates en México, listo para compartirse o convertirse en presentación, usando únicamente un prompt en Claude.",
      pasos:[
        "Abre una conversación nueva en Claude (claude.ai) — no necesitas adjuntar ningún archivo.",

        "Revisa el análisis generado: identifica los datos y tendencias más relevantes para la zona o cuentas que atiendes.",

      ],
      prompt:{titulo:"Prompt — Benchmark de mercado confitería",texto:"Actúa como analista de inteligencia comercial especializado en la industria de confitería, chocolates y snacks premium en México.\n\nTu tarea es generar un benchmark ejecutivo de mercado para la categoría, enfocado en punto de venta y promotoría, que sirva de base para una presentación interna.\n\nIncluye:\n\n1. PANORAMA DE LA CATEGORÍA\nTamaño estimado del mercado de chocolates y confitería en México (valor y volumen anual), principales segmentos (tableta, golosinas, premium, snacks) y estacionalidad más relevante (temporadas pico de venta).\n\n2. PRINCIPALES JUGADORES EN PUNTO DE VENTA\nLas 5 marcas con mayor presencia en anaquel en autoservicios y tiendas de conveniencia, sus estrategias de exhibición más comunes y los rangos de precio por segmento.\n\n3. TENDENCIAS ACTUALES DE CONSUMO\nQué está creciendo (ingredientes, formatos, ocasiones de consumo), qué está siendo desplazado, y cuáles son las oportunidades de nicho menos saturadas.\n\n4. INDICADORES CLAVE PARA PROMOTORÍA\nMétricas que las marcas líderes monitorean en punto de venta, buenas prácticas de gestión de anaquel y señales tempranas de pérdida de participación en una cuenta.\n\n5. RECOMENDACIONES ACCIONABLES (90 días)\n3 acciones concretas que una distribuidora-comercializadora puede implementar para mejorar su posición en el canal.\n\nFormato ejecutivo: secciones claras, datos cuantificables donde sea posible, hallazgos más relevantes en negritas. Al terminar, ofrece convertir el análisis en una presentación de 5 a 6 diapositivas lista para proyectarse."}

    {
      num:2,
      titulo:"Video publicitario de producto (Ritter Pistache)",
      objetivo:"Produce una pieza audiovisual publicitaria de 15 a 30 segundos para redes sociales y pantallas digitales de punto de venta, a partir de imágenes reales del producto.",
      pasos:[
        "PASO OBLIGATORIO: antes de pegar el prompt, adjunta 3 imágenes de Ritter Pistache a la conversación. Imagen 1: packaging frontal con buena resolución. Imagen 2: tableta o interior del chocolate, donde se vea la textura y el pistache. Imagen 3: ángulo complementario, producto abierto o imagen oficial adicional.",
        "Usa imágenes oficiales de la marca o fotografías reales del producto. Evita screenshots de baja resolución o imágenes donde el empaque esté parcialmente oculto.",
        "Abre una conversación nueva en Claude con el modelo de mayor capacidad disponible y activa todas las herramientas disponibles (Design, artefactos, código).",
        "Carga las 3 imágenes en la conversación y luego copia y pega el prompt completo de abajo.",
        "Claude analizará las imágenes, confirmará que las recibió y procederá automáticamente con la producción — no necesitas dar autorización adicional después del análisis.",
        "Revisa el resultado: ajusta colores, texto o composición usando instrucciones en lenguaje natural ('hazlo más oscuro', 'agranda el producto', 'cambia el fondo').",
        "Exporta la pieza final o descarga los archivos generados."
      ],
      prompt:{titulo:"Prompt — Video publicitario Ritter Pistache",texto:"EJERCICIO — CREACIÓN DE VIDEO PUBLICITARIO RITTER PISTACHE\n\nPASO 2 — VERIFICACIÓN OBLIGATORIA DE LAS IMÁGENES\nAntes de diseñar o generar cualquier contenido, analiza las 3 imágenes adjuntas.\nVerifica visualmente: logotipo, nombre exacto del producto, diseño del packaging, colores, tipografías, geometría, proporciones, apariencia del chocolate, textura, pistaches e información visible relevante.\nLas tres imágenes constituyen la REFERENCIA VISUAL PRINCIPAL Y OBLIGATORIA del ejercicio.\n\nREGLA CRÍTICA\nNO INVENTES NI REDISEÑES EL PRODUCTO.\nNo debes modificar arbitrariamente: logo, nombre Ritter, nombre Pistache, packaging, colores originales, tipografías de marca, proporciones, forma del chocolate, textos impresos ni elementos gráficos característicos.\nCuando generes nuevas escenas, debes utilizar las imágenes suministradas como ancla visual del producto real.\nPuedes crear alrededor del producto: fondos, pistaches, chocolate, partículas, iluminación, reflejos, sombras, movimiento, escenarios, composiciones, elementos gráficos. Pero el producto debe permanecer visualmente fiel a las referencias suministradas.\n\nPASO 3 — MODELO Y HERRAMIENTAS\nPara realizar este ejercicio, utiliza el modelo de Claude de mayor capacidad disponible en la cuenta que permita creación de artefactos, ejecución de código y trabajo visual.\nActiva todas las herramientas disponibles relacionadas con: diseño, creación visual, imágenes, animación, código, artifacts, archivos, composición audiovisual. Si existe una función específica de Claude Design, utilízala.\n\nPASO 4 — INICIO DEL TRABAJO\nNo comiences generando el video inmediatamente.\nPrimero:\n1. Confirma que recibiste y puedes visualizar las 3 imágenes.\n2. Analiza las tres referencias.\n3. Determina cuál imagen funcionará mejor como referencia principal del packaging.\n4. Determina cuál utilizarás para representar el chocolate/producto.\n5. Identifica los elementos visuales que deben preservarse obligatoriamente.\n6. Después de completar esta verificación, procede automáticamente con la producción.\nNo solicites autorización adicional después de analizar las imágenes.\n\nROL\nActúa simultáneamente como: Director Creativo Senior de una agencia internacional de publicidad, Director de Arte especializado en productos FMCG, Motion Designer, Especialista en publicidad digital y redes sociales, Especialista en diseño de materiales para Point of Sale (POS), Product Visual Designer, y Especialista en storytelling audiovisual de productos premium.\n\nOBJETIVO PRINCIPAL\nQuiero que diseñes y produzcas — no solamente conceptualices — una pieza audiovisual publicitaria de entre 15 y 30 segundos para Ritter Pistache.\nLa pieza debe tener calidad visual suficiente para utilizarse como una demostración realista de contenido publicitario para redes sociales y pantallas digitales en punto de venta (POS).\n\nA partir de este punto, continúa con TODAS las especificaciones de producción, storyboard, dirección de arte, motion design, audio, formatos, entregables y controles de calidad establecidos en este ejercicio.\n\nREGLA PRIORITARIA DURANTE TODO EL PROCESO:\nLas 3 imágenes cargadas al inicio tienen prioridad como referencia visual del producto. Si existe cualquier contradicción entre una interpretación generada y las fotografías suministradas, prevalecen las fotografías del producto real."}

    {
      num:3,
      titulo:"Anticipación de tendencias en redes sociales",
      objetivo:"Genera un análisis de tendencias emergentes en redes sociales para la categoría de confitería y propón un plan de contenido accionable para el equipo de Marketing o Promotoría.",
      pasos:[
        "Abre una conversación nueva en Claude — no necesitas adjuntar archivos para este ejercicio.",
        "Antes de copiar el prompt, define dos datos: (1) el producto o categoría que quieres analizar (ejemplo: chocolates premium, snacks, Ritter Sport), y (2) la red social de interés (Instagram o TikTok).",
        "Copia el prompt de abajo y sustituye los corchetes [PRODUCTO] y [RED SOCIAL] con tus datos antes de pegarlo.",
        "Revisa las tendencias identificadas y señala en la conversación las que más aplican a tu zona o a las cuentas que atiendes.",
        "Pídele a Claude que genere el calendario de contenido en formato tabla para que sea más fácil de revisar y compartir.",
        "Exporta el resultado como documento o pídele que lo convierta en una presentación de 4 a 5 diapositivas para compartir con el equipo."
      ],
      prompt:{titulo:"Prompt — Tendencias en redes sociales",texto:"Actúa como estratega de contenido digital especializado en marcas de consumo masivo (FMCG) para el mercado mexicano, con experiencia en confitería, chocolates y snacks premium.\n\nTu tarea es hacer un análisis de anticipación de tendencias en redes sociales para la categoría de [PRODUCTO: ejemplo — chocolates premium / confitería / snacks], enfocado en [RED SOCIAL: Instagram / TikTok].\n\nEl análisis debe incluir:\n\n1. TENDENCIAS EMERGENTES (próximos 30 a 90 días)\nIdentifica 5 tendencias de contenido que están ganando tracción en la categoría de alimentos premium y confitería: formatos de video, hashtags en crecimiento, tipos de contenido (recetas, unboxings, comparativas, lifestyle), estéticas visuales con mayor engagement y creators o cuentas que las están impulsando.\n\n2. OPORTUNIDADES DE CONTENIDO\nPara cada tendencia, propón:\n— Un concepto de contenido concreto aplicable a una distribuidora-comercializadora de confitería en México\n— El formato ideal (Reel, Story, carrusel, TikTok corto de 15 a 30 segundos)\n— La duración sugerida y el gancho de apertura (primeros 3 segundos del video)\n— Si requiere producción profesional o puede hacerse con teléfono\n\n3. CALENDARIO DE PUBLICACIÓN (30 días)\nUn plan de contenido semanal estructurado en tabla, con:\n— Frecuencia de publicación por plataforma\n— Distribución de tipos de contenido (educativo, entretenimiento, conversión/venta)\n— Fechas estacionales o fechas clave de la categoría a aprovechar en el periodo\n\n4. INDICADORES DE ÉXITO\nLas 4 métricas más importantes que deberían monitorearse semanalmente para validar si el contenido está funcionando, y qué benchmark usar como referencia para la categoría.\n\nFormato: accionable, con tablas donde ayuden, bullets concretos y sin jerga técnica que no sea usable por un equipo de promotoría o marketing con experiencia básica en redes sociales."}
    },
    {
      num:4,
      titulo:"Kit de diseño digital para redes sociales",
      objetivo:"Crea un kit de piezas gráficas listas para publicarse — post cuadrado, story vertical y variante promocional — para un producto real de la cartera KRAM, usando Claude Design.",
      pasos:[
        "Activa Claude Design en la conversación antes de pegar el prompt (ícono de paleta en la barra inferior de Claude).",
        "Elige un producto de la cartera KRAM para el que quieras crear las piezas (ejemplo: Ritter Pistache, Kinder Bueno, Snickers Mini).",

        "Revisa el Art Direction Brief que Claude genere primero y ajusta lo que necesites antes de que proceda a crear las piezas ('cambia el fondo a oscuro', 'usa tipografía más bold', 'elimina el copy y deja solo el producto').",

      prompt:{titulo:"Prompt — Kit de diseño digital para redes",texto:"Actúa como Director de Arte especializado en marketing digital para marcas de consumo masivo (FMCG) y punto de venta.\n\nQuiero que diseñes un kit de piezas gráficas para redes sociales del siguiente producto:\n\nPRODUCTO: [nombre del producto — ejemplo: Ritter Pistache / Snickers Mini / Kinder Bueno]\nMARCA: [marca comercial]\nCOLORES CLAVE: [colores del empaque o marca — ejemplo: verde oscuro y dorado / azul y rojo / burdeos y blanco]\nCANAL: [dónde se publicará — Instagram / TikTok / pantalla digital de PDV]\nOCASIÓN: [contexto de uso — temporada navideña / lanzamiento de producto / promoción fin de semana / exhibición especial]\n\nEl kit debe incluir:\n\n1. POST PRINCIPAL (feed cuadrado 1:1)\nComposición que muestre el producto como protagonista, con fondo que refuerce la identidad de marca. Incluye: texto de impacto máximo 7 palabras, indicador o logo de marca, y elemento visual que genere deseo (textura, destellos, contexto de consumo o ingredientes del producto).\n\n2. HISTORIA / REEL COVER (9:16 vertical)\nVersión adaptada para Story o portada de Reel. Mismo lenguaje visual que el post principal pero optimizado para pantalla vertical: texto en zona segura (no en los bordes superiores ni inferiores), área visual centrada, jerarquía clara.\n\n3. VARIANTE CON COPY PROMOCIONAL\nUna variante del post principal que incluya un mensaje de oferta o llamada a la acción: 'Disponible ahora', 'Solo esta semana', 'Pídelo con tu promotor', o el copy que aplique al contexto definido.\n\nPara cada pieza:\n— Propón la paleta de colores exacta en formato hex\n— Describe la tipografía sugerida (moderna / manuscrita / bold display)\n— Indica si el diseño va sobre fondo claro u oscuro y por qué\n— Da instrucciones breves sobre qué ajustar si se quiere una segunda versión\n\nPrimero presenta el Art Direction Brief completo de las 3 piezas para revisión y aprobación. Después de confirmar el brief, procede a crear las tres piezas visuales en Claude Design."}
    }

  contenido:[
    {h:"¿Qué es un plugin o conector?", icon:"plug", p:[
      "Es una conexión directa entre la IA y una herramienta que ya usas —Google Drive, Gmail, un calendario— para que pueda leer o generar información ahí, en vez de que tú copies y pegues manualmente entre una aplicación y otra.",
      "Hasta la Sesión 3, todo lo que hicimos dependía de que una persona pegara la información en la conversación (un texto, un reporte, una imagen). Un conector le da a la IA la posibilidad de ir directamente a la fuente: leer un correo, abrir una hoja de cálculo de Google Drive, revisar un evento en el calendario — siempre con los permisos que la persona autorizó de antemano, nunca por su cuenta."
    ], clave:"Un conector le da a la IA acceso directo a la fuente — correo, Drive, calendario — siempre con los permisos que tú autorizaste."},
    {h:"Los conectores nativos de Claude", icon:"grid", p:[
      "Anthropic (la empresa detrás de Claude) construye y mantiene un grupo específico de conectores \"nativos\": listos para usar con solo autorizar tu cuenta, sin configuración técnica. Además de estos, existe un directorio abierto con muchos más conectores de terceros (para otras plataformas de trabajo, gestión de proyectos, etc.) que cualquiera puede agregar, pero que no son construidos directamente por Anthropic."
    ], ul:[
      "Google Drive — busca y trae tus archivos y documentos de Drive como contexto para una tarea.",
      "Gmail — busca y lee tus correos (no puede enviar correos por su cuenta).",
      "Google Calendar — consulta tu calendario y tus eventos programados.",
      "GitHub — accede a tus repositorios y archivos de código; útil como contexto persistente de un proyecto técnico.",
      "Slack — busca en canales y mensajes directos para traer contexto de conversaciones del equipo.",
      "Microsoft 365 — accede a SharePoint, OneDrive, Outlook y Teams (requiere cuenta de trabajo o escuela)."
    ], clave:"Los conectores nativos cubren correo, archivos, calendario, código y chat de equipo — para todo lo demás existe un directorio abierto de conectores de terceros."},
    {h:"Conectores con mayor aplicación en KRAM", icon:"grid", p:[
      "Estos son los conectores con mayor probabilidad de ahorrar tiempo real en la operación de Comercializadora KRAM:"
    ], ul:[
      "Google Drive / Sheets — para tomar reportes de venta o inventario y generar resúmenes, sin exportar y volver a subir archivos manualmente.",
      "Gmail / Outlook — para apoyar en la redacción y triage de correos con supervisores y proveedores (por ejemplo, resumir los 20 correos pendientes del día y señalar cuáles requieren respuesta urgente).",
      "Calendar — para organizar la agenda de visitas a tienda y detectar choques de horario entre supervisores.",
      "Slack / Teams — como alternativa más trazable al WhatsApp disperso que se usa hoy, con historial buscable y resúmenes de conversación."
    ]},
    {h:"Buenas prácticas y límites de seguridad", icon:"shield", p:[
      "Antes de conectar cualquier herramienta, hay que revisar qué información va a poder ver o modificar la IA, y mantener siempre una revisión humana antes de que algo salga hacia un cliente, proveedor o tienda. Conectar no es lo mismo que automatizar sin supervisión.",
      "Una buena regla práctica: un conector puede leer y proponer, pero una persona debe aprobar cualquier acción que salga de KRAM hacia afuera —un correo a un proveedor, un mensaje a una cadena de tiendas— o que modifique un registro importante —un inventario, un presupuesto—. Esa revisión humana en el punto correcto es, de hecho, el mismo principio de \"human-in-the-loop\" que se presentó en la Sesión 2, aplicado ahora a herramientas conectadas de verdad."
    ], clave:"Un conector puede leer y proponer; una persona siempre aprueba lo que sale de KRAM o modifica un registro importante."}
  ],

<script>
/* =========================================================================
   Programa de Adopción de IA — KRAM
   Lógica de la aplicación (router simple por hash + render + quiz + admin)
   ========================================================================= */

const $app = document.getElementById('app');
const $nav = document.getElementById('mainNav');

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){
  try{
    // Se fija explícitamente la zona horaria de Ciudad de México: sin esto, el navegador
    // formatea la fecha en la zona horaria local del dispositivo de quien la ve, y alguien
    // fuera de México (o con su equipo mal configurado) vería una hora distinta a la real.
    return new Date(d).toLocaleString('es-MX', {weekday:'long', day:'2-digit', month:'long', hour:'2-digit', minute:'2-digit', timeZone:'America/Mexico_City'});
  }catch(e){ return d; }
}
function sessionEnd(session){
  const idx = session.id - 1;
  const start = new Date(CONFIG.SESSION_DATES[idx]).getTime();
  return start + CONFIG.SESSION_DURATION_MIN*60000;
}
function quizWindow(session){
  const open = sessionEnd(session);
  const close = open + CONFIG.QUIZ_WINDOW_HOURS*3600000;
  return {open, close};
}
/* Excepción manual: un link con ?excepcion=<CONFIG.EXCEPTION_CODE>&s=<id de sesión>
   fuerza el quiz de esa sesión a 'open' para quien lo abra, sin importar la ventana
   de horario ni si ya lo había contestado en ese navegador. No afecta a nadie más:
   solo aplica a quien entra con ese link exacto. */
function tieneExcepcion(session){
  try{
    const params = new URLSearchParams(location.search);
    const code = params.get('excepcion');
    const s = params.get('s');
    return !!(code && CONFIG.EXCEPTION_CODE && code === CONFIG.EXCEPTION_CODE && String(s) === String(session.id));
  }catch(e){ return false; }
}
function quizStateNow(session){
  if(tieneExcepcion(session)) return 'open';
  const now = Date.now();
  const {open, close} = quizWindow(session);
  const localDone = localStorage.getItem('kia_done_'+session.id);
  if(localDone) return 'done';
  if(now < open) return 'locked';
  if(now > close) return 'closed';
  return 'open';
}
function getPerfil(){
  try{ return JSON.parse(localStorage.getItem('kia_perfil')||'null') || {nombre:'', puesto:''}; }
  catch(e){ return {nombre:'', puesto:''}; }
}
function setPerfil(p){ localStorage.setItem('kia_perfil', JSON.stringify(p)); }

function claudeChip(label){ return `<div class="claude-chip">${claudeMarkSvg()}${esc(label||'Claude')}</div>`; }

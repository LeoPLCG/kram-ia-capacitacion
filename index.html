    {h:"¿Qué es un conector?", icon:"plug", p:[
      "Un conector es un puente entre Claude y una herramienta que ya usas —Google Drive, Gmail, Outlook, un calendario, Slack o Teams— para que pueda leer o escribir información directamente ahí, en vez de que tú copies y pegues manualmente entre una aplicación y otra.",
      "Hasta la Sesión 3, todo lo que hicimos dependía de que una persona pegara la información en la conversación: un texto, un reporte, una imagen. Un conector cambia eso: Claude va directo a la fuente —abre el correo, lee la hoja de cálculo, consulta el evento del calendario— siempre con los permisos que la persona autorizó de antemano, nunca por su cuenta.",
      "Técnicamente un conector es un solo canal hacia una sola herramienta. No sabe qué quieres hacer con esa información: solo abre la puerta. La inteligencia de qué hacer con lo que hay detrás de esa puerta la pones tú en el prompt, o la pone un plugin."
    ], clave:"Un conector es acceso, no criterio: abre la puerta a una herramienta con los permisos que tú autorizaste, pero no decide qué hacer adentro."},

    {h:"¿Qué es un plugin?", icon:"toolbox", p:[
      "Un plugin es un paquete ya armado que se instala de una sola vez y deja a Claude listo para trabajar en un oficio específico —productividad, finanzas, marketing, diseño, datos— sin que tú tengas que configurar nada ni escribir instrucciones desde cero.",
      "La diferencia con un conector es que un plugin no trae una sola pieza: trae las tres piezas que hacen falta para que algo funcione de inmediato. Viene con una descripción que le dice a Claude cuándo usarlo, viene con skills (instrucciones de trabajo ya escritas y probadas) y viene con los conectores que esas skills necesitan, ya declarados.",
      "Piénsalo como la diferencia entre comprar un taladro suelto y comprar la caja de herramientas completa del electricista: el taladro es el conector, la caja —con las herramientas, el manual de cada procedimiento y los accesorios ya emparejados— es el plugin.",
      "Cuando instalas un plugin, Claude no te pregunta qué hacer: ya sabe qué tareas cubre, cómo ejecutarlas paso a paso y a qué herramientas pedirles información. Tú solo autorizas las cuentas."

        ["2. Skills","Instrucciones de trabajo ya escritas: procedimientos paso a paso, formatos de salida, plantillas y criterios de calidad. Cada skill cubre una tarea concreta.","Garantizan que la misma tarea salga siempre igual de bien, la pida quien la pida. Es lo que vimos en la Sesión 3, pero ya empaquetado."],

      "Una tarea programada —en inglés routine o scheduled task— es una instrucción que le dejas escrita a Claude una sola vez para que se ejecute sola, cada cierto tiempo, sin que tú estés ahí para pedirla.",
      "Es el salto de 'yo le pregunto y él responde' a 'él entrega y yo reviso'. Tú defines el qué y el cuándo; Claude se encarga de que exista el resultado a esa hora, todos los lunes, sin que nadie se acuerde de pedirlo.",
      "Hay una característica técnica que cambia por completo cómo se escribe una rutina: cada ejecución arranca en una conversación nueva, en blanco. La rutina no recuerda lo que platicaste en este chat ni lo que hizo la semana pasada. Todo lo que necesita saber tiene que estar escrito dentro de la rutina misma, o vivir en un Proyecto o en un archivo al que la rutina pueda entrar por un conector.",
      "Por eso una rutina mal escrita falla en silencio: no es que se haya equivocado, es que nunca supo. Y por eso una rutina bien escrita es, en realidad, un prompt autosuficiente con hora."
    ], clave:"Cada ejecución de una rutina empieza en blanco: si no está escrito dentro de la rutina o accesible por un conector, para ella no existe."},

    {h:"Cómo se diseña una rutina: el paso a paso", icon:"repeat", p:[
      "Diseñar una rutina no es escribir un prompt y ponerle hora. Es responder siete preguntas en orden, y el orden importa: el error más común es empezar por la frecuencia en vez de por el entregable."
    ], ul:[
      "1. Define el entregable, no la actividad. No 'revisar inventarios', sino 'una lista de los 10 SKU en riesgo de quiebre, ordenados por urgencia, con la tienda y el faltante'. Si no puedes describir la hoja que quieres recibir, todavía no tienes rutina.",
      "2. Define el disparador. Cada cuándo corre: hora exacta, día, frecuencia y zona horaria. Regla práctica: que caiga 30 a 60 minutos antes del momento en que vas a usar el resultado, no a media noche.",
      "3. Define las fuentes. De dónde saldrá la información: búsqueda web, un archivo en Drive o SharePoint, el correo, el calendario, un Proyecto con documentos cargados. Si la fuente no es alcanzable, la rutina no existe.",
      "4. Escribe el prompt como instrucción autónoma. Redáctalo para alguien que llega nuevo: contexto de la empresa, quién eres, qué significa cada término interno, qué hacer si no encuentra datos. Nada de 'como platicamos', 'lo de siempre' o 'igual que la semana pasada'.",
      "5. Define el formato y el destino. En qué forma quieres el resultado —tabla, cinco viñetas, borrador de correo, archivo— y a dónde llega: el chat, tu correo, una carpeta.",
      "6. Define el límite. Qué NO puede hacer sola: no enviar correos hacia afuera, no modificar el inventario, no aprobar nada, no borrar. Todo lo que salga de KRAM o modifique un registro se entrega como borrador para que una persona lo apruebe.",
      "7. Prueba, ajusta y programa. Ejecútala una vez en manual, revisa el resultado con ojo crítico, corrige el prompt y hasta entonces déjala programada. Y agéndate una revisión mensual: una rutina que nadie audita es una rutina que se degrada."
    ], ejemplo:{titulo:"Antes y después del paso 4", texto:"Mal: 'cada lunes mándame el resumen de ventas'. Bien: 'Cada lunes a las 7:30 a.m. (hora CDMX) entra al archivo Sell Out Semanal en la carpeta Comercial de SharePoint, toma la pestaña de la semana que acaba de cerrar, compara contra las cuatro semanas previas y entrégame: 1) tres cadenas con mayor caída en porcentaje, 2) tres con mayor crecimiento, 3) una hipótesis por cada caída. Si el archivo no está actualizado, dímelo y no inventes cifras.'"},
      clave:"El orden correcto es entregable, disparador, fuentes, prompt autónomo, formato, límite y prueba. Empezar por la hora es la forma más rápida de tener una rutina que nadie usa."},

    {h:"Buenas prácticas y límites de seguridad", icon:"shield", p:[
      "Antes de conectar cualquier herramienta hay que revisar qué información va a poder ver o modificar la IA, y mantener siempre una revisión humana antes de que algo salga hacia un cliente, proveedor o tienda. Conectar no es lo mismo que automatizar sin supervisión.",
      "La regla práctica: un conector, un plugin o una rutina pueden leer y proponer, pero una persona debe aprobar cualquier acción que salga de KRAM hacia afuera —un correo a un proveedor, un mensaje a una cadena de tiendas— o que modifique un registro importante —un inventario, un presupuesto—. Es el mismo principio de human-in-the-loop de la Sesión 2, ahora aplicado a herramientas conectadas de verdad.",
      "Con rutinas hay dos cuidados extra. El primero: como corren solas, un error se repite sin que nadie lo note; por eso toda rutina necesita dueño y revisión periódica. El segundo: una rutina que corre sola con permisos amplios es el punto de mayor riesgo del sistema, así que se le dan los permisos mínimos que necesita para su entregable, no todos los que tiene disponible la persona."
    ], clave:"Leer y proponer, sí; enviar, modificar o aprobar, no sin una persona. Y toda rutina lleva dueño, permisos mínimos y revisión mensual."}
  ],

  ejercicios:[
    {
      num:1,
      titulo:"Tu primera rutina: el Radar del lunes",
      objetivo:"Dejar corriendo, antes de que termine la sesión, una tarea programada semanal que no depende de ningún conector ni de permisos de la empresa: cualquier participante puede completarla desde su propia cuenta.",
      pasos:[
        "Elige tu tema de radar: algo que hoy revisas a mano o que nunca alcanzas a revisar. Ejemplos: novedades de tu categoría de producto, movimientos de las cadenas donde operas, cambios de precio de la competencia, noticias de tu zona geográfica.",
        "Define el entregable en una sola frase: 'cinco hallazgos de la semana, cada uno en dos líneas, con una acción sugerida'. Escríbelo antes de tocar Claude.",
        "Abre Claude y copia el prompt de abajo. Sustituye las partes entre corchetes por lo tuyo: tema, rol, zona y hora.",
        "Pide a Claude que lo ejecute una vez en manual, ahí mismo, y revisa el resultado. ¿Te sirve tal cual? ¿Le sobra o le falta algo? Ajusta el texto del prompt hasta que la salida te guste.",
        "Cuando el resultado te convenza, pídele a Claude que lo convierta en tarea programada semanal: 'conviértelo en una tarea programada que corra todos los lunes a las 8:00 a.m., hora de Ciudad de México'.",
        "Verifica que quedó creada y anota su nombre. Confirma que la frecuencia y la hora son las que pediste.",
        "Ponte un recordatorio para el lunes siguiente: cuando llegue el primer resultado automático, evalúalo y ajusta el prompt una vez más. Una rutina se afina en la segunda corrida, no en la primera."
      ],
      prompt:{titulo:"Prompt — Radar semanal", texto:"Quiero que me ayudes a crear una tarea programada semanal. Primero ejecútala una vez en manual para que yo valide el resultado; cuando te lo confirme, la programamos.\n\nCONTEXTO\nTrabajo en [tu puesto] en Comercializadora KRAM, una empresa de [distribución / promotoría en punto de venta] que opera en [tu zona o cadenas]. Mi responsabilidad principal es [describe en una línea]. No tengo tiempo de revisar a mano lo que está pasando en mi categoría y quiero que tú lo hagas por mí cada semana.\n\nTAREA\nCada lunes, busca en fuentes públicas de internet lo más relevante de los últimos 7 días sobre: [tu tema de radar — por ejemplo: lanzamientos y promociones de las marcas que compiten con nuestra categoría en tiendas de conveniencia y autoservicio en México].\n\nQUÉ QUIERO RECIBIR\nExactamente cinco hallazgos, ordenados del más al menos relevante para mi trabajo. Cada hallazgo con esta estructura:\n- Qué pasó (una línea, concreta, con dato o cifra si existe)\n- Por qué me importa a mí en [tu zona o cadenas] (una línea)\n- Qué podría hacer al respecto esta semana (una acción concreta y realizable, no un consejo genérico)\n\nCierra con una sola línea: el hallazgo al que le pondría más atención si solo pudiera atender uno.\n\nREGLAS\n- Si no encuentras cinco hallazgos que valgan la pena, entrégame solo los que sí valen y dímelo abiertamente. Prefiero tres buenos que cinco rellenos.\n- No inventes cifras, marcas ni fechas. Si un dato no está confirmado, márcalo como no confirmado.\n- Incluye la fuente de cada hallazgo.\n- Lenguaje directo, sin relleno corporativo. Máximo una cuartilla.\n- No envíes nada a nadie ni contactes a terceros: solo entrégame el resultado a mí.\n\nHORARIO\nLunes a las 8:00 a.m., hora de Ciudad de México."}
    },
    {
      num:2,
      titulo:"Tres rutinas avanzadas para desarrollar después",
      objetivo:"Para quien quiera ir más lejos por su cuenta: tres rutinas de dificultad real, con conectores y validación humana. No son ejemplos genéricos: cada una resuelve un dolor concreto de la operación de KRAM. Elige una y desarróllala con los siete pasos del método.",
      pasos:[
        "A. VIGÍA DE QUIEBRES DE ANAQUEL — Frecuencia: diaria, 7:00 a.m. Conectores: SharePoint o Drive (archivo de inventario por tienda) y correo. Entregable: lista de los SKU por debajo del mínimo en cada tienda, ordenada por impacto en venta perdida, con el faltante en piezas y el borrador de correo al supervisor de zona ya redactado. Límite obligatorio: el correo se entrega como borrador; la rutina nunca lo envía. Dificultad real: definir el mínimo por SKU y por formato de tienda, no un mínimo general.",
        "B. AUDITOR DE EJECUCIÓN EN PUNTO DE VENTA — Frecuencia: semanal, lunes. Conectores: la carpeta donde promotoría sube las fotos de exhibición y el archivo del planograma vigente. Entregable: reporte por tienda que compara la foto contra el planograma y marca en semáforo las desviaciones —faltante de frentes, producto mal ubicado, material POP ausente— con el ranking de tiendas peor ejecutadas de la semana. Dificultad real: definir criterios de desviación que sean objetivos y auditables, no interpretaciones.",
        "C. RASTREADOR DE PRECIO Y PROMOCIÓN POR CADENA — Frecuencia: dos veces por semana. Conectores: búsqueda web sobre folletos digitales y tiendas en línea de las cadenas, más una hoja de cálculo donde la rutina acumula el histórico. Entregable: no un reporte, sino una alerta condicionada — la rutina solo te escribe cuando detecta un cambio de precio mayor a cierto porcentaje o una promoción nueva de un competidor directo; si no pasa nada, no te molesta. Dificultad real: que escriba en la hoja histórica sin duplicar filas, y calibrar el umbral para que no te sature ni te deje ciego.",
        "Cómo desarrollarla: toma la que elegiste, abre los siete pasos del bloque 'Cómo se diseña una rutina' y responde uno por uno por escrito antes de tocar el teclado. El paso 6 —el límite— es el que decide si tu rutina es segura para producción."
      ],
      prompt:{titulo:"Prompt — Diseño guiado de una rutina avanzada", texto:"Quiero diseñar una tarea programada avanzada y necesito que me ayudes a construirla bien antes de programarla. No la crees todavía.\n\nLA RUTINA QUE QUIERO\n[Describe en dos o tres líneas cuál de las tres elegiste y qué quieres que haga.]\n\nMI CONTEXTO\nPuesto: [tu puesto] en Comercializadora KRAM.\nZona o cadenas que atiendo: [detállalo].\nHerramientas donde vive la información hoy: [SharePoint, Drive, Excel, correo, WhatsApp, etc.].\nQuién usa el resultado además de mí: [nombre y puesto, o 'solo yo'].\n\nLO QUE NECESITO DE TI\nGuíame por los siete pasos del método, uno a la vez. No avances al siguiente hasta que yo conteste el actual:\n1. Entregable — ayúdame a describir con precisión la hoja o el mensaje exacto que quiero recibir, incluyendo columnas o secciones.\n2. Disparador — propón frecuencia y hora, y dime por qué esa y no otra.\n3. Fuentes — dime exactamente qué archivos o conectores hacen falta y qué pasa si alguno no está disponible ese día.\n4. Prompt autónomo — redáctamelo completo, asumiendo que quien lo ejecuta no sabe nada de KRAM ni de mí.\n5. Formato y destino — proponme el formato de salida y dónde debe quedar el resultado.\n6. Límite — enlista explícitamente qué NO debe hacer la rutina por su cuenta y qué debe dejar como borrador para aprobación humana.\n7. Prueba — dime cómo validar que funcionó bien la primera vez y qué señal indicaría que se está degradando.\n\nAl final, entrégame el prompt final en un solo bloque, listo para programar, y una lista de los permisos mínimos que requiere. Señala cualquier punto donde creas que la rutina podría fallar en silencio."}
    }
  ],
  quiz:[
    {q:"¿Cuál es la diferencia central entre un conector y un plugin?", opts:["No hay diferencia, son sinónimos","El plugin solo sirve para programadores","El conector da acceso a una herramienta; el plugin trae además el criterio de trabajo (descripción, skills y conectores)","El conector cuesta dinero y el plugin es gratis"], correct:2},
    {q:"Un plugin viene preconstruido con tres piezas. ¿Cuáles son?", opts:["Descripción que lo dispara, skills con los procedimientos y los conectores que necesita","Usuario, contraseña y licencia","Un video, un manual y un examen","Base de datos, servidor y respaldo"], correct:0},
    {q:"En el plugin de Productividad, ¿para qué sirve la skill de memoria (memory-management)?", opts:["Para guardar contraseñas","Para aumentar la velocidad de respuesta","Para borrar conversaciones viejas","Para que Claude entienda tu lenguaje interno: personas, proyectos, apodos y siglas de la empresa"], correct:3},
    {q:"¿Por qué una tarea programada debe escribirse como instrucción autónoma?", opts:["Por elegancia en la redacción","Porque cada ejecución arranca en una conversación nueva, sin memoria de tu chat ni de corridas anteriores","Porque así consume menos energía","Porque el sistema no acepta textos largos"], correct:1},
    {q:"Al diseñar una rutina, ¿cuál es el primer paso correcto?", opts:["Definir la hora a la que va a correr","Conectar todas las herramientas disponibles","Definir con precisión el entregable que quieres recibir","Escribir el prompt lo más corto posible"], correct:2},
    {q:"Una rutina detecta un quiebre de inventario y redacta el correo al proveedor. ¿Qué debe pasar?", opts:["Enviarlo automáticamente para ganar tiempo","Enviarlo solo si es urgente","Borrarlo y avisar por WhatsApp","Dejarlo como borrador para que una persona lo revise y apruebe antes de salir"], correct:3}

{

  titulo:"Agentes punta a punta: hacia dónde va KRAM",

  objetivo:"Al terminar, cada participante entiende qué es un agente punta a punta y una conexión API, conecta un tablero de Power BI a una API pública, y usa Claude con pensamiento crítico para analizar una base de ventas y datos reales del Banco Mundial.",
  ladderFocus:[], ladderPreview:[],
  agenda:[{"t": 4, "titulo": "Recapitulando la escalera completa", "desc": "De dónde partimos a dónde llegamos."}, {"t": 5, "titulo": "¿Qué es un agente punta a punta?", "desc": "Varios pasos, una sola cadena."}, {"t": 4, "titulo": "Casos en otras empresas", "desc": "Curative y Klarna, de otros giros."}, {"t": 4, "titulo": "El humano sigue al mando", "desc": "Gobernanza básica."}, {"t": 5, "titulo": "El pensamiento crítico no se delega", "desc": "Caso real: Starbucks."}, {"t": 4, "titulo": "Modelo Operativo Agéntico", "desc": "Los 6 conceptos, NMO y ROI."}, {"t": 14, "titulo": "Conexiones API + Power BI", "desc": "Qué es una API y ejercicio: tablero conectado al Banco Mundial."}, {"t": 4, "titulo": "Bonus: Instinct", "desc": "Asistente por WhatsApp para notas y recordatorios personales."}, {"t": 15, "titulo": "Ejercicio final con datos", "desc": "Base de ventas en Excel + conexión al Banco Mundial."}, {"t": 4, "titulo": "Cierre del programa y quiz", "desc": "Qué sigue e instrucciones del quiz."}],
  contenido:[
    {h:"¿Qué es un agente punta a punta?", icon:"linkchain", p:[
      "Es un agente que encadena varios pasos —recibir información, analizarla, generar un resultado, notificar a alguien— sin que una persona tenga que intervenir en cada paso individual. La persona sigue definiendo las reglas y revisando los puntos críticos, pero ya no hace el trabajo manual de cada eslabón.",
      "La diferencia con lo visto en la Sesión 4 es de alcance: un conector le da a la IA acceso a una herramienta puntual (leer un correo, abrir una hoja de cálculo). Un agente punta a punta encadena varios de esos accesos en un solo flujo continuo — por ejemplo, leer un archivo, analizarlo, redactar un resultado y notificar a alguien, todo en una sola cadena, con una persona revisando el resultado final o los puntos que se definieron como críticos."
    ], clave:"Un conector da acceso a una herramienta puntual; un agente punta a punta encadena varios accesos en un solo flujo continuo."},
    {h:"Cómo se ve esto en otras empresas (de otros giros)", icon:"forward", p:[
      "Esto no es una propuesta de lo que KRAM debe construir ni una discusión de alcance para este programa: son ejemplos reales, de empresas de otros giros, para dimensionar hacia dónde puede evolucionar una operación cuando decide llevar los agentes hasta el final de un proceso."
    ], ul:[
      "Curative (aseguradora de salud, EUA): en lugar de renovar un contrato de software de atención a clientes de aproximadamente 600 mil dólares al año, su equipo construyó una herramienta propia con IA generativa en cerca de 2 meses, hecha a la medida de cómo trabaja la aseguradora — sin depender de un proveedor externo para cada ajuste.",
      "Klarna (fintech / banca digital, Europa): consolidó datos que antes vivían repartidos en varios sistemas de terceros hacia infraestructura propia, y sumó un asistente con IA para atención a clientes — con ahorros reportados del orden de 40 millones de dólares al año.",
      "El patrón común no es \"reemplazar personas por un chatbot\": es que la empresa entendió tan bien su propio proceso que pudo construir (o adaptar con inputs directos) una herramienta propia en lugar de depender por completo de un sistema externo genérico."
    ], clave:"El punto no es que KRAM deba construir su propio ERP o CRM: es entender que un proceso bien entendido y bien documentado es lo que hace posible, más adelante, decidir con criterio qué construir, qué adaptar y qué dejar como está."},
    {h:"Por qué el humano sigue al mando", icon:"usercheck", p:[
      "Entre más autónomo es un agente, más importa definir con claridad dónde interviene una persona: quién aprueba, quién revisa, quién es responsable del resultado final. Esta idea —gobernanza básica— es la base de cualquier conversación seria sobre agentes, y se profundiza en programas posteriores.",
      "Esto no es una limitación temporal mientras \"la tecnología mejora\": incluso en las organizaciones más avanzadas en el uso de agentes, hay puntos de revisión humana definidos a propósito — no porque el agente no pueda seguir solo, sino porque hay decisiones (las que afectan dinero, a un cliente, o la reputación de la empresa) que siempre deben tener a una persona respondiendo por ellas."
    ], clave:"Incluso en las organizaciones más avanzadas en IA, hay decisiones que siempre debe responder una persona."},
    {h:"El pensamiento crítico no se delega", icon:"magnifier", p:[
      "Hay una tarea que ningún agente, por avanzado que sea, puede hacer por ti: decidir si su resultado realmente está bien. Ese juicio —revisar, cuestionar, validar antes de dar por bueno un resultado— es pensamiento crítico, y es justo la parte que no se delega, sobre todo antes de llevar algo a producción (es decir, antes de que ese resultado empiece a usarse de verdad en la operación, no solo en una prueba).",
      "Un caso real y reciente lo ilustra bien: en septiembre de 2025, Starbucks lanzó en más de 11,300 tiendas de Norteamérica una herramienta de visión por computadora para contar inventario automáticamente a partir de fotos de refrigeradores y anaqueles. En pruebas controladas llegó a 99% de precisión — un resultado excelente sobre el papel. Pero en la operación real, los reflejos de luz en las puertas de acero de los refrigeradores duplicaban conteos (por ejemplo, leche de avena marcada como \"5\" aparecía como \"10\"), el empaque de temporada obligaba a reentrenar el modelo hasta por 6 semanas cada vez, y los sistemas de back-end de la empresa (de los años 90) no podían procesar la información en tiempo real. Starbucks canceló el proyecto en abril de 2026, después de invertir más de 10 millones de dólares en varios años, y regresó al conteo manual.",
      "La lección no es \"la IA falló\": es que 99% de precisión en pruebas no es lo mismo que \"funciona bien en producción\", y que nadie validó a fondo esa diferencia antes de escalarlo a miles de tiendas. Ser responsable con la IA significa exactamente eso: no asumir que un resultado está bien solo porque lo generó la IA, sino comprobarlo — especialmente cuando ese resultado va a pasar a usarse de verdad, y más todavía cuando se escala rápido y a gran tamaño."
    ], clave:"99% de precisión en una prueba no es lo mismo que \"funciona en producción\". Antes de escalar algo hecho con IA, alguien tiene que validarlo — esa responsabilidad no se delega."},
    {h:"El horizonte final: el Modelo Operativo Agéntico", icon:"target", p:[
      "Estos seis conceptos describen hacia dónde apuntan (o ya operan) las empresas con un Nivel de Madurez Organizacional (NMO) avanzado — Nivel 5 en adelante. No son el punto de partida de este programa: son el mapa del terreno completo, para que el equipo de KRAM sepa que existe y entienda, en términos generales, de qué se trata cada pieza."
    ], tabla:{headers:["Concepto","En qué consiste"], rows:[
      ["ROI Agéntico (Return on Agentic Investment)","El retorno de la inversión hecha en agentes: no basta con que un agente funcione técnicamente, tiene que devolver más valor (tiempo, dinero, calidad) del que costó construirlo y mantenerlo."],
      ["Soberanía de Datos (Data Sovereignty)","Quién controla, dónde vive y bajo qué reglas se usa la información de la empresa cuando la IA participa en los procesos — no depender por completo de que un tercero decida esas reglas por ti."],
      ["Ecosistema Agéntico (Organización Agéntica)","Un conjunto de agentes que colaboran entre sí dentro de la empresa, no agentes aislados uno por proceso, sino una red coordinada de automatización."],
      ["Agency Transfer (Transferencia de Agencia)","El proceso deliberado de decidir qué decisiones se le transfieren a un agente y cuáles se quedan con una persona — es una decisión de gobernanza, no algo que ocurre solo."],
      ["Negocio AI-Native (AI-Native Business)","Una empresa diseñada desde cero alrededor de la IA, no una empresa tradicional a la que se le \"agrega\" IA encima de procesos ya existentes."],
      ["Organización Agéntica (Agentic Organization)","El modelo operativo completo de una empresa una vez transformada alrededor de agentes: la meta final de este camino, no el punto de partida de este programa."]
    ]}, clave:"Conclusión: más IA no es necesariamente mejor. El nivel de agentización correcto depende del Nivel de Madurez Organizacional (NMO) de cada empresa, y siempre debe apuntar a un retorno esperado concreto, con niveles claros y un plan estructurado que haga posible llegar ahí — no a acumular herramientas de IA por acumularlas."},
    {"h": "¿Qué es una conexión API?", "icon": "plug", "p": ["API significa \"Application Programming Interface\" (interfaz de programación de aplicaciones). Es la puerta oficial por la que un sistema le pide datos a otro sin que una persona tenga que exportar, descargar y copiar archivos a mano.", "La analogía más útil es la de un mesero: tú (Power BI, Excel o Claude) no entras a la cocina del sistema; le haces un pedido al mesero (la API) con un formato acordado, y él te regresa exactamente lo que pediste. Si el pedido está mal escrito, el mesero te regresa un error, no una suposición.", "En la práctica, casi todas las APIs modernas funcionan igual: haces una petición a una dirección web (endpoint), con parámetros que dicen qué quieres (país, indicador, fechas), y la respuesta llega en un formato estructurado, normalmente JSON. Algunas APIs son públicas y abiertas, como la del Banco Mundial; otras —las de un ERP, un CRM o un sistema de inventarios— piden una llave de acceso (API key o token)."], "tabla": {"headers": ["Pieza", "Qué es", "Ejemplo con el Banco Mundial"], "rows": [["Endpoint", "La dirección web a la que se hace la petición.", "api.worldbank.org/v2/country/MX/indicator/..."], ["Parámetros", "Lo que especificas en la petición.", "País = MX, indicador = inflación, fechas = 2015:2025, formato = json"], ["Respuesta (JSON)", "Los datos que regresa la API, estructurados.", "Una lista con año, país y valor de cada dato"], ["Autenticación", "Cómo la API sabe quién eres.", "No requiere: es una API pública y gratuita"], ["Límites", "Cuántas peticiones o filas regresa por llamada.", "Por defecto 50 filas por página (se amplía con per_page)"]]}, "clave": "Una API key o token es como una contraseña: nunca se pega en un chat, en un correo ni en un archivo compartido. Si alguien te pide una, se gestiona con Sistemas."},
    {"h": "Cómo conectar un tablero de Power BI a una API (paso a paso)", "icon": "grid", "p": ["Power BI Desktop (gratuito, para Windows) puede leer una API directamente con el conector \"Web\". Una vez publicado en Power BI Service, el tablero se puede actualizar solo, sin que nadie vuelva a descargar un archivo. Este es el flujo completo; en el Ejercicio 1 de esta sesión lo hacen ustedes con la API del Banco Mundial."], "ul": ["1. Abre Power BI Desktop (si no lo tienes, descárgalo gratis desde Microsoft Store).", "2. En la cinta Inicio, da clic en Obtener datos → Web.", "3. Elige \"Básico\" y pega la URL de la API: https://api.worldbank.org/v2/country/MX;US;CO;BR/indicator/FP.CPI.TOTL.ZG?format=json&date=2015:2025&per_page=500", "4. Cuando pregunte cómo autenticarte, elige \"Anónimo\" (la API del Banco Mundial es pública) y da clic en Conectar.", "5. Se abre el Editor de Power Query con una \"Lista\" de dos elementos: el primero es información de la consulta (páginas, total) y el segundo son los datos. Da clic en el segundo elemento (List) → \"A la tabla\" → expande las columnas country, date y value.", "6. Renombra columnas (País, Año, Inflación %) y asigna tipos de dato: Año como número entero e Inflación como número decimal. Atajo: Inicio → Editor avanzado y pega el código M que viene en el Ejercicio 1.", "7. Da clic en Cerrar y aplicar.", "8. Arma el tablero: gráfico de líneas (Eje X = Año, Eje Y = Inflación %, Leyenda = País), una tarjeta con el último valor de México y un segmentador por país.", "9. Publica: Inicio → Publicar → elige tu área de trabajo (requiere cuenta de trabajo con Power BI).", "10. En Power BI Service, abre el modelo semántico → Configuración → Credenciales del origen de datos (Anónimo) → activa Actualización programada (por ejemplo, diaria a las 7:00 a.m.)."], "ejemplo": {"titulo": "Cómo encaja Claude en este flujo", "texto": "Claude no reemplaza a Power BI: te ayuda a entender la documentación de la API, a escribir o corregir el código M de Power Query, a explicarte un error de conexión y a proponer qué visualizaciones tienen sentido para la pregunta de negocio."}, "clave": "El valor de una conexión API no es el tablero bonito: es que el dato llega solo, siempre igual y desde la fuente oficial, sin descargas manuales ni versiones distintas del mismo archivo."},
    {"h": "Bonus: ¿Qué es Instinct?", "icon": "chat", "p": ["Para quienes siguen usando WhatsApp para anotar pendientes, tickets o registros sueltos: Instinct es un asistente personal con IA al que le escribes por WhatsApp, iMessage o SMS (o le llamas). No es una app nueva: le mandas un mensaje como a un contacto más, y él anota, te recuerda, da seguimiento y, si le das permisos, puede actuar en tu correo o calendario.", "Es de la empresa Spear Street Technology y, a octubre de 2026, opera como beta por invitación o lista de espera; el registro se hace solo con tu número de celular.", "Un punto importante antes de usarlo: sus términos lo limitan a uso personal, lo nombran tu \"agente\" (lo que acuerde a tu nombre te obliga), y por defecto entrena con tus datos. Por eso, en KRAM se recomienda usarlo solo para notas y recordatorios personales, nunca con cuentas, correos ni información de la empresa."], "ul": ["1. Entra a instinct.com y da clic en \"Text Instinct to get started\" (te lleva a app.instinct.com).", "2. Escribe tu número de celular (el que usas en WhatsApp). Confirma que acepte números de México (+52): la lista de países cambia.", "3. Escribe el código de 6 dígitos que te llega por SMS. Al enviarlo aceptas sus términos: léelos antes.", "4. Si quedas en lista de espera, espera el mensaje de bienvenida o usa un link de invitación de alguien que ya lo use.", "5. Antes de usarlo, entra a app.instinct.com/settings y desactiva el uso de tus datos para entrenar modelos.", "6. Empieza sin conectar correo ni calendario. Escríbele por WhatsApp, por ejemplo: \"Anota: la tienda 12 reportó faltante de pistache\" o \"Recuérdame el jueves a las 9 a.m. revisar el pedido del CEDIS\".", "7. Pídele un resumen: \"¿Qué pendientes anoté esta semana?\". Si en algún momento conectas algo, que sea solo personal, nunca cuentas de KRAM.", "8. Si lo dejas de usar, no basta con desconectar: borra tus datos en app.instinct.com/workspace y elimina la cuenta."], "clave": "Instinct sirve para sacar las notas sueltas de WhatsApp a un lugar donde alguien les da seguimiento, pero es una herramienta personal: lo de KRAM vive en las herramientas corporativas y en Claude con sus conectores."},
    {"h": "Ejercicio final: analiza ventas y contexto económico con Claude", "icon": "magnifier", "p": ["Este último ejercicio junta todo el programa: una base de ventas (ficticia) de KRAM, una fuente oficial externa conectada por API y el pensamiento crítico que no se delega. Descarga el Excel en el Ejercicio 3 (al final de esta página), súbelo a Claude y responde estas 5 preguntas. Ojo: varias tienen una trampa a propósito; Claude te da números, tú decides si son confiables."], "ul": ["Pregunta 1 (Excel): ¿Qué zona tiene la mayor venta neta en agosto–septiembre? ¿Es también la zona con mejor desempeño? Justifica.", "Pregunta 2 (Excel): ¿Qué tienda creció más de agosto a septiembre? Antes de responder, valida que el dato sea confiable y que la comparación sea justa.", "Pregunta 3 (Excel): La promoción de Ritter Sport Pistache (20% de descuento en las semanas 36 y 37), ¿funcionó? Considera también lo que pasó las semanas siguientes.", "Pregunta 4 (Banco Mundial): ¿Cuál fue la inflación anual de México en 2025 y cuál fue el año más alto entre 2019 y 2025? Si la venta de una cadena creció 4% contra el año anterior, ¿creció de verdad?", "Pregunta 5 (Banco Mundial): ¿El PIB per cápita de México en dólares subió o bajó en 2025 contra 2024? ¿Eso prueba que el consumidor tiene menos poder de compra? Sostén tu respuesta con un segundo indicador del Banco Mundial."], "clave": "Una respuesta de IA sin validar es una hipótesis, no una conclusión. Revisa siempre: ¿el dato tiene errores de captura?, ¿la comparación es justa?, ¿la fuente es oficial?"},

tabla limpia con columnas País, Año (entero) e Inflación % (decimal), sin filas vacías.\n3. Si te comparto un mensaje de error, dime exactamente en qué paso está el problema y cómo corregirlo.\n4. Proponme 3 visualizaciones útiles para un director comercial de una empresa de consumo masivo en México, y qué pregunta de negocio responde cada una.\n\nNo inventes nombres de indicadores: si no estás seguro de un código del Banco Mundial, dímelo."}, "extras": [{"titulo": "Código M para el Editor avanzado de Power Query", "texto": "let\n    Fuente = Json.Document(Web.Contents(\"https://api.worldbank.org/v2/country/MX;US;CO;BR/indicator/FP.CPI.TOTL.ZG?format=json&date=2015:2025&per_page=500\")),\n    Datos = Fuente{1},\n    Tabla = Table.FromList(Datos, Splitter.SplitByNothing(), {\"Registro\"}),\n    Expandida = Table.ExpandRecordColumn(Tabla, \"Registro\", {\"country\", \"date\", \"value\"}),\n    ConPais = Table.ExpandRecordColumn(Expandida, \"country\", {\"value\"}, {\"País\"}),\n    Renombrada = Table.RenameColumns(ConPais, {{\"date\", \"Año\"}, {\"value\", \"Inflación %\"}}),\n    Filtrada = Table.SelectRows(Renombrada, each [#\"Inflación %\"] <> null),\n    Tipos = Table.TransformColumnTypes(Filtrada, {{\"Año\", Int64.Type}, {\"Inflación %\", type number}})\nin\n    Tipos"}]}, {"num": 2, "titulo": "Bonus: tus notas de WhatsApp con Instinct", "objetivo": "Para quien hoy anota pendientes, tickets o registros en WhatsApp: probar un asistente que les da seguimiento, cuidando que sea solo de uso personal.", "pasos": ["Entra a instinct.com → \"Text Instinct to get started\" (app.instinct.com).", "Registra tu número de celular (+52) y escribe el código de 6 dígitos que llega por SMS. Lee los términos antes de aceptar.", "Si quedas en lista de espera, espera el mensaje de bienvenida o usa un link de invitación.", "Ve a app.instinct.com/settings y desactiva el uso de tus datos para entrenamiento.", "Sin conectar correo ni calendario, mándale por WhatsApp tres notas de prueba entras un problema, dímelo y muestra el resultado con y sin corrección.\n\nPARTE A — Base de ventas\n1. ¿Qué zona tiene la mayor venta neta en el periodo? ¿Es también la de mejor desempeño? Considera el número de tiendas por zona.\n2. ¿Qué tienda creció más de agosto a septiembre? Valida que el dato sea confiable antes de concluir.\n3. La promoción de Ritter Sport Pistache (20% de descuento, semanas 36 y 37), ¿funcionó? Compara contra el promedio de las semanas previas e incluye lo que pasó en las semanas 38 y 39.\n\nPARTE B — Banco Mundial (consulta la API oficial: api.worldbank.org/v2)\n4. ¿Cuál fue la inflación anual de México (indicador FP.CPI.TOTL.ZG) en 2025 y cuál fue el año más alto entre 2019 y 2025? Si la venta de una cadena creció 4% contra el año anterior, ¿cuál fue su crecimiento real?\n5. ¿El PIB per cápita de México en dólares corrientes (NY.GDP.PCAP.CD) subió o bajó en 2025 contra 2024? ¿Eso prueba que el consumidor tiene menos poder de compra? Sostén tu respuesta con un indicador a precios constantes.\n\nFORMATO: para cada pregunta da la respuesta corta, el número que la sostiene y una línea con la validación que hiciste. Cita el enlace de cada dato del Banco Mundial. No inventes cifras: si no puedes obtener un dato, dilo."}}]

  {type:"content", badge:true, badgeLabel:"Claude", h:"¿El modelo \"piensa\" antes de responder?",
    p:[
      "Elegir qué modelo usar (Haiku, Sonnet, Opus, Fable) es una decisión. Si ese modelo \"piensa\" antes de responder es una decisión aparte, independiente de cuál elijas.",
      "En los modelos más recientes, esto funciona con \"pensamiento adaptativo\": el propio modelo decide cuándo y cuánto conviene pensar antes de contestar, y tú puedes ajustar qué tan a fondo lo hace.",
      "Este razonamiento extra vale la pena en problemas difíciles, de varios pasos — y es un gasto innecesario en una simple consulta o clasificación rápida."
    ], clave:"Elegir el modelo (qué tan capaz) y activar el pensamiento adaptativo (cuánto razona antes de responder) son dos decisiones independientes."},
  {type:"ladder", h:"La escalera de niveles de conocimiento de Claude",
    caption:"Este es el mapa de referencia que vamos a usar en las 5 sesiones. Cada una señala en qué peldaño está trabajando. El programa capacita de forma práctica del Nivel 1 al Nivel 5 — el Nivel 6 aparece aquí solo como referencia de contexto, no como algo que este programa vaya a capacitar."},
  {type:"sessions", h:"Las 5 sesiones del programa"}
];
</script>
<script>
/* =========================================================================
   Programa de Adopción de IA — KRAM
   Lógica de la aplicación (router simple por hash + render + quiz + admin)
   ========================================================================= */

const $app = document.getElementById('app');
const $nav = document.getElementById('mainNav');

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(d){
  try{
    // Se fija explícitamente la zona horaria de Ciudad de México: sin esto, el navegador
    // formatea la fecha en la zona horaria local del dispositivo de quien la ve, y alguien
    // fuera de México (o con su equipo mal configurado) vería una hora distinta a la real.
    return new Date(d).toLocaleString('es-MX', {weekday:'long', day:'2-digit', month:'long', hour:'2-digit', minute:'2-digit', timeZone:'America/Mexico_City'});
  }catch(e){ return d; }
}
function sessionEnd(session){
  const idx = session.id - 1;
  const start = new Date(CONFIG.SESSION_DATES[idx]).getTime();
  return start + CONFIG.SESSION_DURATION_MIN*60000;
}
function quizWindow(session){
  const open = sessionEnd(session);
  const close = open + CONFIG.QUIZ_WINDOW_HOURS*3600000;
  return {open, close};
}
/* Excepción manual: un link con ?excepcion=<CONFIG.EXCEPTION_CODE>&s=<id de sesión>
   fuerza el quiz de esa sesión a 'open' para quien lo abra, sin importar la ventana
   de horario ni si ya lo había contestado en ese navegador. No afecta a nadie más:
   solo aplica a quien entra con ese link exacto. */
function tieneExcepcion(session){
  try{
    const params = new URLSearchParams(location.search);
    const code = params.get('excepcion');
    const s = params.get('s');
    return !!(code && CONFIG.EXCEPTION_CODE && code === CONFIG.EXCEPTION_CODE && String(s) === String(session.id));
  }catch(e){ return false; }
}
function quizStateNow(session){
  if(tieneExcepcion(session)) return 'open';
  const now = Date.now();
  const {open, close} = quizWindow(session);
  const localDone = localStorage.getItem('kia_done_'+session.id);
  if(localDone) return 'done';
  if(now < open) return 'locked';
  if(now > close) return 'closed';
  return 'open';
}
function getPerfil(){
  try{ return JSON.parse(localStorage.getItem('kia_perfil')||'null') || {nombre:'', puesto:''}; }
  catch(e){ return {nombre:'', puesto:''}; }
}
function setPerfil(p){ localStorage.setItem('kia_perfil', JSON.stringify(p)); }

  linkchain: '<path d="M9 15l6-6"/><path d="M8 12l-2 2a3 3 0 0 0 4 4l2-2"/><path d="M16 12l2-2a3 3 0 0 0-4-4l-2 2"/>',
  usercheck: '<circle cx="8" cy="8" r="4"/><path d="M2 21c0-4 3-6 6-6s6 2 6 6"/><path d="M15 13l2 2 4-4"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  toolbox: '<rect x="2" y="8" width="20" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M2 13h20"/><path d="M10 13v1.5M14 13v1.5"/>',
  briefcase: '<rect x="2" y="7" width="20" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M2 13h20"/>',
  magnifier: '<circle cx="10" cy="10" r="7"/><path d="M21 21l-5.2-5.2"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>'
};
function contentIconSvg(name){
  const path = CONTENT_ICONS[name] || CONTENT_ICONS.lightbulb;
  return `<div class="c-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg></div>`;
}
function claveMarkSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.3h6c0-1.1.4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>'; }

/* ---------- motor de diapositivas (usado en Inicio y en cada sesión) ---------- */
function slideBodyHtml(slide){
  switch(slide.type){
    case 'cover': {
      const ps = (slide.p||[]).map(t=>`<p>${esc(t)}</p>`).join('');
      return `<div class="stag">${esc(slide.tag||'')}</div><h2>${esc(slide.h)}</h2>${ps}`;
    }
    case 'content': {
      const badge = slide.badge ? claudeChip(slide.badgeLabel) : '';
      const icon = (!slide.badge && slide.icon) ? contentIconSvg(slide.icon) : '';
      const ps = (slide.p||[]).map(t=>`<p>${esc(t)}</p>`).join('');
      const ul = slide.ul ? `<ul>${slide.ul.map(li=>`<li>${esc(li)}</li>`).join('')}</ul>` : '';
      const tabla = slide.tabla ? `<div class="content-table-wrap"><table class="content-table">
          <thead><tr>${slide.tabla.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>${slide.tabla.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>` : '';
      const ej = slide.ejemplo ? `<div class="example-box"><div class="ex-tag">${esc(slide.ejemplo.titulo||'Ejemplo')}</div><p>${esc(slide.ejemplo.texto)}</p></div>` : '';
      const cl = slide.clave ? `<div class="clave-box"><span class="cl-mark">${claveMarkSvg()}</span><div class="cl-body"><div class="cl-tag">Punto clave</div><p>${esc(slide.clave)}</p></div></div>` : '';
      return `${icon}${badge}<h3>${esc(slide.h)}</h3>${ps}${ul}${tabla}${ej}${cl}`;
    }
    case 'ladder': {
      const cap = slide.caption ? `<p>${esc(slide.caption)}</p>` : '';
      return `<h3>${esc(slide.h||'La escalera de niveles de conocimiento de Claude')}</h3>${cap}${renderLadder(slide.focus||[], slide.preview||[])}`;
    }
    case 'timeline': {
      const intro = slide.intro ? `<p>${esc(slide.intro)}</p>` : '';
      const items = (slide.items||[]).map(it=>`
        <div class="t-item">
          <div class="t-rail"><div class="t-dot"></div><div class="t-line"></div></div>
          <div class="t-year">${esc(it.year)}</div>
          <div class="t-body"><h5>${esc(it.title)}</h5><p>${esc(it.desc)}</p></div>
        </div>`).join('');
      return `<h3>${esc(slide.h)}</h3>${intro}<div class="timeline">${items}</div>`;
    }
    case 'tiers': {
      const badge = slide.badge ? claudeChip(slide.badgeLabel) : '';
      const intro = slide.intro ? `<p>${esc(slide.intro)}</p>` : '';
      const items = (slide.items||[]).map(it=>`
        <div class="tier-card ${it.highlight?'highlight':''}">
          ${it.highlight?'<span class="tpill">Punto de partida</span>':''}
          <h5>${esc(it.name)}</h5><p>${esc(it.desc)}</p>
        </div>`).join('');
      const note = slide.note ? `<p style="margin-top:14px; font-size:12.5px; color:var(--ink-soft);">${esc(slide.note)}</p>` : '';
      return `${badge}<h3>${esc(slide.h)}</h3>${intro}<div class="tiers-grid">${items}</div>${note}`;
    }
    case 'video': {
      const nota = slide.nota ? `<p class="${slide.nota.indexOf('⚠')===0?'video-note warn':'video-note'}">${esc(slide.nota)}</p>` : '';
      /* Un video se puede reproducir dentro de esta página solo si su autor lo
         permite (slide.embed) y si la página está publicada en http/https. */
      const abreEnYoutube = (slide.embed === false) || !canEmbedVideos();
      let aviso = '';
      if(slide.embed === false){
        aviso = `<p class="video-note">El autor de este video no permite reproducirlo dentro de otras páginas, así que al dar clic se abre en YouTube, en una pestaña nueva.</p>`;
      }else if(!canEmbedVideos()){
        aviso = `<p class="video-note">Estás abriendo este archivo directamente desde tu computadora: al dar clic, el video se abre en YouTube en una pestaña nueva. Publicado en línea (el link de la capacitación), se reproduce dentro de esta misma página.</p>`;
      }
      return `<h3>${esc(slide.titulo)}</h3>
        <div class="video-facade" data-video-id="${esc(slide.id)}" data-abre-youtube="${abreEnYoutube?'1':'0'}">
          <img src="https://img.youtube.com/vi/${esc(slide.id)}/hqdefault.jpg" alt="${esc(slide.titulo)}" loading="lazy">
          <div class="playbtn">${playSvg()}</div>
          ${abreEnYoutube ? '<span class="video-chip">Se abre en YouTube ↗</span>' : ''}
        </div>
        <a class="video-external-link" href="https://www.youtube.com/watch?v=${esc(slide.id)}" target="_blank" rel="noopener">Ver en YouTube ↗</a>${nota}${aviso}`;
    }
    case 'sessions': {
      const items = SESSIONS.map(s=>`
        <div class="item">
          <div class="time">S${s.id}</div>
          <div class="txt"><h5>${esc(s.titulo)}</h5><p>${esc(fmtDate(CONFIG.SESSION_DATES[s.id-1]))}</p></div>
        </div>`).join('');
      return `<h3>${esc(slide.h||'Las 5 sesiones del programa')}</h3><div class="agenda">${items}</div>`;
    }
    default: return '';
  }
}
function renderSlideInline(slide){ return `<div class="slide-card">${slideBodyHtml(slide)}</div>`; }

/* YouTube exige un "referer" HTTP válido para reproducir un video incrustado.
   Un archivo abierto directamente desde el disco (file://) no envía ese dato y
   el reproductor devuelve el "Error 153". En ese caso abrimos el video en una
   pestaña nueva; publicado en http/https se reproduce dentro de la página. */
function canEmbedVideos(){
  return location.protocol === 'http:' || location.protocol === 'https:';
}
function bindVideoFacades(container){
  container.querySelectorAll('.video-facade').forEach(f=>{
    f.addEventListener('click', ()=>{
      const id = f.dataset.videoId;
      if(f.dataset.abreYoutube === '1'){
        window.open('https://www.youtube.com/watch?v=' + id, '_blank', 'noopener');
        return;
      }
      f.outerHTML = `<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="video" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
    });
  });
}

/* ---------- modo presentación (pantalla completa, navegación tipo PowerPoint) ---------- */
let presentState = null;
function startPresentation(slides, tag){
  presentState = {slides, idx:0, tag};
  document.addEventListener('keydown', presentKeyHandler);
  document.addEventListener('fullscreenchange', presentFsHandler);
  renderPresentOverlay(true);
}
function presentFsHandler(){
  if(presentState && !document.fullscreenElement){ closePresentation(); }
}
function closePresentation(){
  if(!presentState) return;
  presentState = null;
  document.removeEventListener('keydown', presentKeyHandler);
  document.removeEventListener('fullscreenchange', presentFsHandler);
  const el = document.getElementById('presentOverlay');
  if(el) el.remove();
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
function presentKeyHandler(e){
  if(!presentState) return;
  if(e.key==='Escape'){ closePresentation(); return; }
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); presentGo(1); }
  if(e.key==='ArrowLeft'){ presentGo(-1); }
}
function presentGo(delta){
  if(!presentState) return;
  const n = presentState.slides.length;
  presentState.idx = Math.min(n-1, Math.max(0, presentState.idx+delta));
  renderPresentOverlay(false);
}
function renderPresentOverlay(first){
  let el = document.getElementById('presentOverlay');
  if(!el){
    el = document.createElement('div');
    el.id = 'presentOverlay';
    el.className = 'present-overlay';
    document.body.appendChild(el);
  }
  if(first && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{ /* el navegador puede bloquear fullscreen; la superposición sigue funcionando igual */ });
  }
  const {slides, idx, tag} = presentState;
  const slide = slides[idx];
  const dots = slides.map((_,i)=>`<span class="pd ${i===idx?'active':''}"></span>`).join('');
  el.innerHTML = `
    <div class="present-top">
      <span class="ptag">${esc(tag)}</span>
      <div style="display:flex; align-items:center; gap:16px;">
        <img src="${LCG_LOGO_LIGHT}" alt="London Consulting Group" class="present-lcg-logo">
        <button class="present-close" id="presentCloseBtn">Salir (Esc)</button>
      </div>
    </div>
    <div class="present-body"><div class="present-slide">${slideBodyHtml(slide)}</div></div>
    <div class="present-bottom">
      <button class="present-nav-btn" id="presentPrev" ${idx===0?'disabled':''} aria-label="Anterior">‹</button>
      <div class="present-dots">${dots}</div>
      <button class="present-nav-btn" id="presentNext" ${idx===slides.length-1?'disabled':''} aria-label="Siguiente">›</button>
      <span class="present-counter">${idx+1} / ${slides.length}</span>
    </div>
  `;
  document.getElementById('presentCloseBtn').addEventListener('click', closePresentation);
  document.getElementById('presentPrev').addEventListener('click', ()=>presentGo(-1));
  document.getElementById('presentNext').addEventListener('click', ()=>presentGo(1));
  bindVideoFacades(el);
}

function buildSessionSlides(session){
  const slides = [];
  const focusTxt = (session.ladderFocus||[]).map(n=>LADDER.find(l=>l.n===n).nombre).join(', ');
  slides.push({type:'ladder', focus:session.ladderFocus, preview:session.ladderPreview,
    caption: focusTxt ? `Esta sesión trabaja de forma práctica: ${focusTxt}.` : 'Esta sesión es una demostración de visión, fuera del uso práctico diario.'});
  (session.contenido||[]).forEach(b=> slides.push({type:'content', h:b.h, p:b.p, ul:b.ul, tabla:b.tabla, ejemplo:b.ejemplo, icon:b.icon, clave:b.clave}));
  const vids = session.videos || (session.video ? [session.video] : []);
  vids.forEach(v=> slides.push({type:'video', id:v.id, titulo:v.titulo, nota:v.nota, embed:v.embed}));
  return slides;
}

/* ---------- Supabase (REST directo, sin dependencias externas) ---------- */
async function supaInsert(table, row){
  if(!SUPABASE_READY) throw new Error('Supabase no configurado todavía');
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}`, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apikey': CONFIG.SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + CONFIG.SUPABASE_ANON_KEY,
      'Prefer':'return=representation'
    },
    body: JSON.stringify(row)
  });
  if(!res.ok){ const t = await res.text(); throw new Error('Supabase insert falló: '+t); }
  return res.json();
}
async function supaSelect(table){
  if(!SUPABASE_READY) throw new Error('Supabase no configurado todavía');
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}?select=*&order=created_at.desc`, {
    headers:{ 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + CONFIG.SUPABASE_ANON_KEY }
  });
  if(!res.ok){ const t = await res.text(); throw new Error('Supabase select falló: '+t); }
  return res.json();
}
async function supaUploadFile(sessionSlug, file){
  if(!SUPABASE_READY) throw new Error('Supabase no configurado todavía');
  const path = `${sessionSlug}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9_.-]/g,'_')}`;
  const res = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/entregables/${path}`, {
    method:'POST',
    headers:{
      'apikey': CONFIG.SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + CONFIG.SUPABASE_ANON_KEY,
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if(!res.ok){ const t = await res.text(); throw new Error('Supabase storage falló: '+t); }
  return `${CONFIG.SUPABASE_URL}/storage/v1/object/public/entregables/${path}`;
}

/* ---------- Home ---------- */
function renderLadder(focus=[], preview=[]){
  let html = `<div class="ladder">`;
  LADDER.forEach(r=>{
    let cls='rung', badge='';
    // El Nivel 6 nunca se marca como "cubierto" ni "próximo a ver": este programa no capacita
    // ni lleva al equipo hasta ese nivel, así que siempre se muestra en gris, como referencia.
    if(r.n===6){ cls+=' preview'; badge='<span class="badge">Solo referencia</span>'; }
    else if(focus.includes(r.n)){ cls+=' covered'; badge='<span class="badge">Esta sesión</span>'; }
    else if(preview.includes(r.n)){ cls+=' touch'; badge='<span class="badge">Se ve</span>'; }
    html += `<div class="${cls}">${badge}<div class="num">${r.n}</div><h5>${esc(r.nombre)}</h5><p>${esc(r.desc)}</p></div>`;
  });
  html += `</div>`;
  return html;
}

function renderHome(){
  let cards = SESSIONS.map(s=>`
    <div class="sesion-card" data-go="#${s.slug}">
      <div class="tag">Sesión ${s.id}</div>
      <h4>${esc(s.titulo)}</h4>
      <p>${esc(fmtDate(CONFIG.SESSION_DATES[s.id-1]))}</p>
    </div>`).join('');

  $app.innerHTML = `
    <div class="hero" style="border-radius:16px;">
      <span class="pill">IMPULSA · London Consulting Group</span>
      <h1>Programa de Adopción de IA para KRAM</h1>
      <p class="lead">Cinco sesiones de 65 minutos, de fundamentos a primera práctica con agentes. Nivel básico, pensado para el personal de KRAM seleccionado para este programa.</p>
      <div class="grid5">${cards}</div>
    </div>

    <div class="card" style="margin-bottom:24px;">
      <div class="deck-head">
        <div class="section-title" style="margin-bottom:0;"><span class="dot"></span><h3>Introducción al programa</h3></div>
        <button class="btn-present" id="presentInicio">${presentIcon()} Modo presentación</button>
      </div>
      <div class="slide-stack" id="inicioSlides"></div>
    </div>

    <div class="banner info">
      Cada quiz se responde en casa, dentro de las ${CONFIG.QUIZ_WINDOW_HOURS} horas siguientes al cierre de cada sesión en vivo. Se abre automáticamente al terminar la sesión y se cierra pasado ese plazo.
    </div>
  `;
  $app.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click', ()=>{ location.hash = el.dataset.go; }));

  document.getElementById('inicioSlides').innerHTML = INICIO_SLIDES.map(renderSlideInline).join('');
  bindVideoFacades(document.getElementById('inicioSlides'));
  document.getElementById('presentInicio').addEventListener('click', ()=> startPresentation(INICIO_SLIDES, 'Introducción al programa'));
}

/* ---------- Session page ---------- */
function renderSession(session){
  const {open, close} = quizWindow(session);
  const state = quizStateNow(session);

  const agenda = session.agenda.map(a=>`
    <div class="item">
      <div class="time">${a.t} min</div>
      <div class="txt"><h5>${esc(a.titulo)}</h5><p>${esc(a.desc)}</p></div>
    </div>`).join('');

  $app.innerHTML = `
    <div class="session-hero">
      <div class="tag">Sesión ${session.id} de 5</div>
      <h2>${esc(session.titulo)}</h2>
      <p>${esc(session.objetivo)}</p>
      <div class="meta-row">
        <div class="m"><strong>${CONFIG.SESSION_DURATION_MIN} min</strong>Duración en vivo</div>
        <div class="m"><strong>${esc(fmtDate(CONFIG.SESSION_DATES[session.id-1]))}</strong>Fecha programada</div>
        <div class="m"><strong>6 reactivos</strong>Quiz individual en casa</div>
      </div>
    </div>

    <div class="two-col">
      <div class="stack">
        <div class="card">
          <div class="deck-head">
            <div class="section-title" style="margin-bottom:0;"><span class="dot"></span><h3>Contenido de la sesión</h3></div>
            <button class="btn-present" id="presentSession">${presentIcon()} Modo presentación</button>
          </div>
          <p style="font-size:12.5px; color:var(--ink-soft); margin:-8px 0 4px 0;">Pensado para proyectarse en vivo (Teams u otra pantalla compartida) — usa el botón de arriba para verlo en pantalla completa.</p>
          <div class="slide-stack" id="sessionSlides"></div>
        </div>
        <div class="card" id="quizCard"></div>
      </div>
      <div class="stack">
        <div class="card side-card">
          <h4>Agenda (${CONFIG.SESSION_DURATION_MIN} min)</h4>
          <div class="agenda">${agenda}</div>
        </div>
        <div class="card side-card">
          <h4>Quiz — ventana de respuesta</h4>
          <p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;">Abre: ${esc(fmtDate(open))}</p>
          <p style="font-size:12.5px; color:var(--ink-soft); margin-bottom:0;">Cierra: ${esc(fmtDate(close))}</p>
        </div>
      </div>
    </div>

    ${(session.ejercicios && session.ejercicios.length) ? `<div class="card" style="margin-top:24px;" id="ejerciciosCard"></div>` : ''}
  `;

  const slides = buildSessionSlides(session);
  document.getElementById('sessionSlides').innerHTML = slides.map(renderSlideInline).join('');
  bindVideoFacades(document.getElementById('sessionSlides'));
  document.getElementById('presentSession').addEventListener('click', ()=> startPresentation(slides, session.titulo));

  renderQuizCard(session);
  if(session.ejercicios && session.ejercicios.length) renderEjercicios(session);
}

function renderEjercicios(session){
  const el = document.getElementById('ejerciciosCard');
  if(!el) return;
  const items = session.ejercicios.map((ej,i)=>{
    const pasos = (ej.pasos||[]).map(p=>`<li>${esc(p)}</li>`).join('');
    const promptId = `ej-prompt-${session.id}-${i}`;
    const promptBlock = ej.prompt ? `<div class="prompt-box">
      <div class="prompt-header">
        <span class="prompt-label">Prompt para copiar y pegar en Claude</span>
        <button class="copy-btn" data-pid="${esc(promptId)}">Copiar</button>
      </div>
      <pre id="${esc(promptId)}" class="prompt-text">${esc(ej.prompt.texto)}</pre>
    </div>` : '';
    return `<div class="ejercicio-card">
      <div class="ej-num">Ejercicio ${esc(String(ej.num||i+1))}</div>
      <h4 class="ej-titulo">${esc(ej.titulo)}</h4>
      ${ej.objetivo?`<p class="ej-objetivo">${esc(ej.objetivo)}</p>`:''}
      <h5 class="ej-steps-label">Guía paso a paso</h5>
      <ol class="ej-pasos">${pasos}</ol>
      ${ej.descarga ? `<p style="margin:0 0 16px 0;"><button class="btn" data-descarga="${esc(ej.descarga.nombre)}">⬇ ${esc(ej.descarga.etiqueta)}</button></p>` : ''}
      ${promptBlock}
      ${(ej.extras||[]).map((x,k)=>`<div class="prompt-box" style="margin-top:12px;">
        <div class="prompt-header">
          <span class="prompt-label">${esc(x.titulo)}</span>
          <button class="copy-btn" data-pid="${esc(promptId)}-x${k}">Copiar</button>
        </div>
        <pre id="${esc(promptId)}-x${k}" class="prompt-text">${esc(x.texto)}</pre>
      </div>`).join('')}
    </div>`;
  }).join('');

  el.innerHTML = `
    <div class="section-title" style="margin-bottom:12px;"><span class="dot"></span><h3>Ejercicios aplicados</h3></div>
    <p style="font-size:13px; color:var(--ink-soft); margin-bottom:20px;">Practica durante la sesión en vivo o en cualquier momento después. Cada ejercicio incluye una guía paso a paso y un prompt listo para usar en Claude.</p>
    ${items}
  `;

  el.querySelectorAll('[data-descarga]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const bin = atob(EXCEL_VENTAS_B64);
      const bytes = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const blob = new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = btn.dataset.descarga;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    });
  });

  el.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const pid = btn.getAttribute('data-pid');
      const pre = document.getElementById(pid);
      if(!pre) return;
      const txt = pre.textContent;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(()=>{
          btn.textContent='¡Copiado!'; btn.classList.add('copied');
          setTimeout(()=>{ btn.textContent='Copiar'; btn.classList.remove('copied'); }, 2200);
        }).catch(fallback);
      } else { fallback(); }
      function fallback(){
        try{
          const r=document.createRange(); r.selectNodeContents(pre);
          const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
          document.execCommand('copy'); s.removeAllRanges();
          btn.textContent='¡Copiado!'; btn.classList.add('copied');
          setTimeout(()=>{ btn.textContent='Copiar'; btn.classList.remove('copied'); }, 2200);
        }catch(e){}
      }
    });
  });
}

/* ---------- Quiz ---------- */
function renderQuizCard(session){
  const el = document.getElementById('quizCard');
  const state = quizStateNow(session);

  const statusMap = {
    locked: {cls:'locked', txt:'Aún no disponible'},
    open: {cls:'open', txt:'Disponible ahora'},
    closed: {cls:'closed', txt:'Plazo cerrado'},
    done: {cls:'done', txt:'Ya lo respondiste en este dispositivo'}
  };
  const st = statusMap[state];

  let inner = `<div class="section-title"><span class="dot"></span><h3>Quiz de la Sesión ${session.id}</h3></div>
    <span class="quiz-status ${st.cls}">${st.txt}</span>`;

  if(state==='locked'){
    inner += `<p class="helptext">Este quiz se habilita automáticamente al terminar la sesión en vivo (${esc(fmtDate(sessionEnd(session)))}) y permanece abierto durante ${CONFIG.QUIZ_WINDOW_HOURS} horas.</p>`;
  } else if(state==='closed'){
    inner += `<p class="helptext">El plazo de ${CONFIG.QUIZ_WINDOW_HOURS} horas para responder este quiz ya terminó. Contacta a tu facilitador si necesitas una extensión.</p>`;
  } else if(state==='done'){
    inner += `<p class="helptext">Ya registramos tu respuesta desde este dispositivo. Si necesitas corregir algo, contacta a tu facilitador.</p>`;
  } else {
    const perfil = getPerfil();
    const puestoOpts = PUESTOS.map(p=>`<option value="${esc(p)}" ${perfil.puesto===p?'selected':''}>${esc(p)}</option>`).join('');
    const qs = session.quiz.map((q,i)=>`
      <div class="qcard">
        <div class="qtitle">${i+1}. ${esc(q.q)}</div>
        ${q.opts.map((o,j)=>`
          <label class="opt"><input type="radio" name="q${i}" value="${j}" required> <span>${esc(o)}</span></label>
        `).join('')}
      </div>`).join('');

    let entregableField = '';
    if(session.entregable){
      if(session.entregable.tipo==='file'){
        entregableField = `<div class="field"><label>${esc(session.entregable.etiqueta)}</label>
          <input type="file" id="entregableFile" accept="image/*,.pdf">
          <p class="helptext">${esc(session.entregable.ayuda)}</p></div>`;
      } else if(session.entregable.tipo==='texto'){
        entregableField = `<div class="field"><label>${esc(session.entregable.etiqueta)}</label>
          <textarea id="entregableTexto" placeholder="Escribe aquí..."></textarea>
          <p class="helptext">${esc(session.entregable.ayuda)}</p></div>`;
      } else if(session.entregable.tipo==='texto+file'){
        entregableField = `<div class="field"><label>${esc(session.entregable.etiqueta)}</label>
          <textarea id="entregableTexto" placeholder="Escribe aquí los pasos de tu propuesta..."></textarea>
          <input type="file" id="entregableFile" accept="image/*,.pdf" style="margin-top:8px;">
          <p class="helptext">${esc(session.entregable.ayuda)}</p></div>`;
      }
    }

    inner += `
      <form id="quizForm" style="margin-top:16px;">
        <div class="field"><label>Nombre completo</label><input type="text" id="fNombre" value="${esc(perfil.nombre)}" required></div>
        <div class="field"><label>Puesto</label><select id="fPuesto" required><option value="">Selecciona tu puesto</option>${puestoOpts}</select></div>
        ${qs}
        ${entregableField}
        <button class="btn" type="submit">Enviar y ver calificación</button>
        <div id="quizMsg" class="helptext"></div>
      </form>
      <div id="quizResult"></div>
    `;
  }
  el.innerHTML = inner;

  if(state==='open'){
    document.getElementById('quizForm').addEventListener('submit', (e)=>handleQuizSubmit(e, session));
  }
}

async function handleQuizSubmit(e, session){
  e.preventDefault();
  const form = e.target;
  const nombre = document.getElementById('fNombre').value.trim();
  const puesto = document.getElementById('fPuesto').value;
  if(!nombre || !puesto){ return; }
  setPerfil({nombre, puesto});

  let aciertos = 0;
  const respuestas = [];
  session.quiz.forEach((q,i)=>{
    const sel = form.querySelector(`input[name="q${i}"]:checked`);
    const val = sel ? parseInt(sel.value,10) : -1;
    const ok = val === q.correct;
    if(ok) aciertos++;
    respuestas.push({pregunta:q.q, seleccion:val, correcta:q.correct, ok});
  });
  const total = session.quiz.length;
  const porcentaje = Math.round((aciertos/total)*100);

  // entregable
  let entregable_texto = null, entregable_url = null;
  const tField = document.getElementById('entregableTexto');
  if(tField) entregable_texto = tField.value.trim();
  const fField = document.getElementById('entregableFile');

  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const msg = document.getElementById('quizMsg');

  try{
    if(fField && fField.files && fField.files[0]){
      entregable_url = await supaUploadFile(session.slug, fField.files[0]);
    }
    await supaInsert(`quiz_sesion_${session.id}`, {
      nombre, puesto,
      respuestas,
      aciertos, total, porcentaje,
      entregable_texto, entregable_url
    });
    msg.textContent = '';
  }catch(err){
    console.warn('No se pudo guardar en Supabase:', err.message);
    msg.textContent = SUPABASE_READY
      ? 'Tu calificación se muestra abajo, pero hubo un problema guardándola en el servidor. Toma una captura de pantalla por seguridad.'
      : 'Supabase todavía no está conectado en esta copia del archivo — tu calificación se muestra abajo, pero no se guardó en ningún servidor.';
  }

  localStorage.setItem('kia_done_'+session.id, '1');

  const resultDiv = document.getElementById('quizResult');
  const low = porcentaje < 60;
  resultDiv.innerHTML = `
    <div class="result-panel ${low?'low':''}">
      <div class="score">${porcentaje}<small>%</small></div>
      <p>${aciertos} de ${total} respuestas correctas</p>
      <div class="review">
        ${respuestas.map((r,i)=>`
          <div class="ritem">
            <span class="${r.ok?'ok':'bad'}">${r.ok?'✔':'✘'}</span>
            <span>${esc(r.pregunta)}${r.ok?'':` — respuesta correcta: “${esc(session.quiz[i].opts[session.quiz[i].correct])}”`}</span>
          </div>`).join('')}
      </div>
    </div>
  `;
  form.style.display = 'none';
}

/* ---------- Admin ---------- */
function renderAdmin(){
  const isAuth = sessionStorage.getItem('kia_admin')==='1';
  if(!isAuth){
    $app.innerHTML = `
      <div class="card" style="max-width:420px; margin:40px auto;">
        <div class="section-title"><span class="dot"></span><h3>Panel de administrador</h3></div>
        <p style="font-size:13.5px; color:var(--ink-soft);">Acceso restringido al equipo de IMPULSA / LCG y a KRAM.</p>
        <div class="field"><label>Clave de acceso</label><input type="text" id="adminPass"></div>
        <button class="btn" id="adminGo">Entrar</button>
        <p class="helptext" style="margin-top:14px;">Nota de seguridad: esta clave es una barrera básica del lado del navegador, no un control de acceso real. Para un panel de administrador con seguridad de nivel producción, se recomienda añadir autenticación de Supabase (Auth) y reglas de RLS que limiten la lectura de resultados solo a usuarios autenticados como administradores.</p>
      </div>`;
    document.getElementById('adminGo').addEventListener('click', ()=>{
      if(document.getElementById('adminPass').value === CONFIG.ADMIN_PASSCODE){
        sessionStorage.setItem('kia_admin','1');
        renderAdmin();
      } else {
        alert('Clave incorrecta.');
      }
    });
    return;
  }

  if(!SUPABASE_READY){
    $app.innerHTML = `
      <div class="banner warn">
        Este archivo todavía no está conectado a un proyecto de Supabase. Edita <code>CONFIG.SUPABASE_URL</code> y <code>CONFIG.SUPABASE_ANON_KEY</code> al inicio del archivo, crea las tablas indicadas abajo, y este panel se llenará automáticamente con los resultados reales.
      </div>
      ${renderSqlBlock()}
    `;
    return;
  }

  $app.innerHTML = `<div class="card"><p>Cargando resultados desde Supabase…</p></div>`;
  loadAdminData();
}

function renderSqlBlock(){
  const sql = `-- Ejecuta esto una vez en el SQL Editor de tu proyecto Supabase
-- (Project Settings > API te da la URL y la anon key para pegar en CONFIG)

create extension if not exists pgcrypto;

${SESSIONS.map(s=>`create table if not exists quiz_sesion_${s.id} (
  id uuid primary key default gen_random_uuid(),
  created_at timestamptz default now(),
  nombre text not null,
  puesto text not null,
  respuestas jsonb not null,
  aciertos int not null,
  total int not null,
  porcentaje numeric not null,
  entregable_texto text,
  entregable_url text
);
alter table quiz_sesion_${s.id} enable row level security;
create policy "insertar_publico" on quiz_sesion_${s.id} for insert to anon with check (true);
create policy "leer_publico" on quiz_sesion_${s.id} for select to anon using (true);
`).join('\n')}
-- Bucket de Storage para los entregables (crear manualmente en Storage > New Bucket):
-- nombre: entregables · público: sí (o usa URLs firmadas si prefieres privacidad)`;
  return `<div class="card">
    <div class="section-title"><span class="dot"></span><h3>SQL para crear las tablas en Supabase</h3></div>
    <p style="font-size:13px; color:var(--ink-soft);">La política "leer_publico" permite que este panel lea resultados usando la misma llave pública (anon) del formulario. Es una simplificación válida para una primera versión interna; si más adelante quieres restringir la lectura solo a administradores autenticados, cámbiala por una política basada en Supabase Auth.</p>
    <pre style="white-space:pre-wrap; background:#F3F2EE; padding:16px; border-radius:10px; font-size:12px; overflow-x:auto;">${esc(sql)}</pre>
  </div>`;
}

async function loadAdminData(){
  try{
    const results = await Promise.all(SESSIONS.map(s => supaSelect(`quiz_sesion_${s.id}`).catch(()=>[])));
    renderAdminDashboard(results);
  }catch(err){
    $app.innerHTML = `<div class="banner warn">No se pudieron cargar los resultados: ${esc(err.message)}</div>${renderSqlBlock()}`;
  }
}

function renderAdminDashboard(results){
  const roster = JSON.parse(localStorage.getItem('kia_roster')||'[]');

  const totalRespuestas = results.reduce((a,r)=>a+r.length,0);
  const promedios = results.map(r => r.length ? Math.round(r.reduce((a,x)=>a+Number(x.porcentaje||0),0)/r.length) : null);
  const promedioGlobal = (()=>{ const vals = promedios.filter(v=>v!=null); return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0; })();
  const entregablesRecibidos = results.reduce((a,r)=>a + r.filter(x=>x.entregable_texto || x.entregable_url).length, 0);

  let statRow = `<div class="stat-row">
    <div class="stat"><div class="v">${totalRespuestas}</div><div class="l">Respuestas totales (5 sesiones)</div></div>
    <div class="stat"><div class="v">${promedioGlobal}%</div><div class="l">Calificación promedio global</div></div>
    <div class="stat"><div class="v">${entregablesRecibidos}</div><div class="l">Entregables recibidos</div></div>
    <div class="stat"><div class="v">${roster.length || '—'}</div><div class="l">Participantes en lista maestra</div></div>
  </div>`;

  let rosterCard = `
    <div class="card" style="margin-bottom:24px;">
      <div class="section-title"><span class="dot"></span><h3>Lista maestra de participantes</h3></div>
      <p style="font-size:13px; color:var(--ink-soft);">Pega aquí un CSV con columnas <code>nombre,puesto</code> (una persona por línea) para calcular el % de respuesta y quiénes faltan por sesión. Se guarda solo en este navegador.</p>
      <textarea id="rosterInput" placeholder="Nombre Apellido,Promotor(a)&#10;Otra Persona,Supervisor(a) de Promotoría">${esc((JSON.parse(localStorage.getItem('kia_roster_raw')||'""'))||'')}</textarea>
      <button class="btn secondary" id="rosterSave" style="margin-top:10px;">Guardar lista</button>
    </div>`;

  let sessionCards = SESSIONS.map((s,i)=>{
    const rows = results[i];
    const respondieron = new Set(rows.map(r=>(r.nombre||'').trim().toLowerCase()));
    const faltantes = roster.filter(p => !respondieron.has((p.nombre||'').trim().toLowerCase()));
    const pctResp = roster.length ? Math.round((respondieron.size/roster.length)*100) : null;

    const tableRows = rows.map(r=>{
      const pct = Math.round(Number(r.porcentaje||0));
      const cls = pct>=80?'high':(pct>=50?'mid':'low');
      const entregable = r.entregable_url ? `<a href="${esc(r.entregable_url)}" target="_blank" rel="noopener">Ver archivo</a>` : (r.entregable_texto ? esc(r.entregable_texto).slice(0,60)+'…' : '—');
      return `<tr>
        <td>${esc(r.nombre)}</td>
        <td>${esc(r.puesto)}</td>
        <td><span class="badge-pct ${cls}">${pct}%</span></td>
        <td>${r.aciertos}/${r.total}</td>
        <td>${entregable}</td>
        <td>${r.created_at ? new Date(r.created_at).toLocaleString('es-MX') : '—'}</td>
      </tr>`;
    }).join('');

    return `
      <div class="card" style="margin-bottom:20px;">
        <div class="section-title"><span class="dot"></span><h3>Sesión ${s.id} — ${esc(s.titulo)}</h3></div>
        <p style="font-size:13px; color:var(--ink-soft);">
          ${rows.length} respuesta(s)${pctResp!=null ? ` · ${pctResp}% de la lista maestra respondió` : ''}
        </p>
        ${faltantes.length ? `<p style="font-size:12.5px; color:var(--rojo); margin-bottom:14px;"><strong>Faltan por responder (${faltantes.length}):</strong> ${faltantes.map(f=>esc(f.nombre)).join(', ')}</p>` : ''}
        <div class="table-scroll">
        <table class="datatable">
          <thead><tr><th>Nombre</th><th>Puesto</th><th>%</th><th>Aciertos</th><th>Entregable</th><th>Fecha</th></tr></thead>
          <tbody>${tableRows || '<tr><td colspan="6" style="color:var(--ink-soft);">Sin respuestas todavía.</td></tr>'}</tbody>
        </table>
        </div>
      </div>`;
  }).join('');

  $app.innerHTML = `
    <div class="section-title"><span class="dot"></span><h3>Panel de administrador — vista global</h3></div>
    ${statRow}
    ${rosterCard}
    ${sessionCards}
  `;

  document.getElementById('rosterSave').addEventListener('click', ()=>{
    const raw = document.getElementById('rosterInput').value;
    const rows = raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const [nombre, puesto] = l.split(',');
      return {nombre:(nombre||'').trim(), puesto:(puesto||'').trim()};
    });
    localStorage.setItem('kia_roster', JSON.stringify(rows));
    localStorage.setItem('kia_roster_raw', JSON.stringify(raw));
    renderAdminDashboard(results);
  });
}

/* ---------- Router ---------- */
function route(){
  renderNav();
  const hash = (location.hash || '#inicio').replace('#','');
  if(hash === 'inicio' || hash===''){ renderHome(); return; }
  if(hash === 'admin'){ renderAdmin(); return; }
  const session = SESSIONS.find(s=>s.slug===hash);
  if(session){ renderSession(session); return; }
  renderHome();
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

/* ---------- motor de diapositivas (usado en Inicio y en cada sesión) ---------- */
function slideBodyHtml(slide){
  switch(slide.type){
    case 'cover': {
      const ps = (slide.p||[]).map(t=>`<p>${esc(t)}</p>`).join('');
      return `<div class="stag">${esc(slide.tag||'')}</div><h2>${esc(slide.h)}</h2>${ps}`;
    }
    case 'content': {
      const badge = slide.badge ? claudeChip(slide.badgeLabel) : '';
      const icon = (!slide.badge && slide.icon) ? contentIconSvg(slide.icon) : '';
      const ps = (slide.p||[]).map(t=>`<p>${esc(t)}</p>`).join('');
      const ul = slide.ul ? `<ul>${slide.ul.map(li=>`<li>${esc(li)}</li>`).join('')}</ul>` : '';
      const tabla = slide.tabla ? `<div class="content-table-wrap"><table class="content-table">
          <thead><tr>${slide.tabla.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
          <tbody>${slide.tabla.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>` : '';
      const ej = slide.ejemplo ? `<div class="example-box"><div class="ex-tag">${esc(slide.ejemplo.titulo||'Ejemplo')}</div><p>${esc(slide.ejemplo.texto)}</p></div>` : '';
      const cl = slide.clave ? `<div class="clave-box"><span class="cl-mark">${claveMarkSvg()}</span><div class="cl-body"><div class="cl-tag">Punto clave</div><p>${esc(slide.clave)}</p></div></div>` : '';
      return `${icon}${badge}<h3>${esc(slide.h)}</h3>${ps}${ul}${tabla}${ej}${cl}`;
    }
    case 'ladder': {
      const cap = slide.caption ? `<p>${esc(slide.caption)}</p>` : '';
      return `<h3>${esc(slide.h||'La escalera de niveles de conocimiento de Claude')}</h3>${cap}${renderLadder(slide.focus||[], slide.preview||[])}`;
    }
    case 'timeline': {
      const intro = slide.intro ? `<p>${esc(slide.intro)}</p>` : '';
      const items = (slide.items||[]).map(it=>`
        <div class="t-item">
          <div class="t-rail"><div class="t-dot"></div><div class="t-line"></div></div>
          <div class="t-year">${esc(it.year)}</div>
          <div class="t-body"><h5>${esc(it.title)}</h5><p>${esc(it.desc)}</p></div>
        </div>`).join('');
      return `<h3>${esc(slide.h)}</h3>${intro}<div class="timeline">${items}</div>`;
    }
    case 'tiers': {
      const badge = slide.badge ? claudeChip(slide.badgeLabel) : '';
      const intro = slide.intro ? `<p>${esc(slide.intro)}</p>` : '';
      const items = (slide.items||[]).map(it=>`
        <div class="tier-card ${it.highlight?'highlight':''}">
          ${it.highlight?'<span class="tpill">Punto de partida</span>':''}
          <h5>${esc(it.name)}</h5><p>${esc(it.desc)}</p>
        </div>`).join('');
      const note = slide.note ? `<p style="margin-top:14px; font-size:12.5px; color:var(--ink-soft);">${esc(slide.note)}</p>` : '';
      return `${badge}<h3>${esc(slide.h)}</h3>${intro}<div class="tiers-grid">${items}</div>${note}`;
    }
    case 'video': {
      const nota = slide.nota ? `<p class="${slide.nota.indexOf('⚠')===0?'video-note warn':'video-note'}">${esc(slide.nota)}</p>` : '';
      /* Un video se puede reproducir dentro de esta página solo si su autor lo
         permite (slide.embed) y si la página está publicada en http/https. */
      const abreEnYoutube = (slide.embed === false) || !canEmbedVideos();
      let aviso = '';
      if(slide.embed === false){
        aviso = `<p class="video-note">El autor de este video no permite reproducirlo dentro de otras páginas, así que al dar clic se abre en YouTube, en una pestaña nueva.</p>`;
      }else if(!canEmbedVideos()){
        aviso = `<p class="video-note">Estás abriendo este archivo directamente desde tu computadora: al dar clic, el video se abre en YouTube en una pestaña nueva. Publicado en línea (el link de la capacitación), se reproduce dentro de esta misma página.</p>`;
      }
      return `<h3>${esc(slide.titulo)}</h3>
        <div class="video-facade" data-video-id="${esc(slide.id)}" data-abre-youtube="${abreEnYoutube?'1':'0'}">
          <img src="https://img.youtube.com/vi/${esc(slide.id)}/hqdefault.jpg" alt="${esc(slide.titulo)}" loading="lazy">
          <div class="playbtn">${playSvg()}</div>
          ${abreEnYoutube ? '<span class="video-chip">Se abre en YouTube ↗</span>' : ''}
        </div>
        <a class="video-external-link" href="https://www.youtube.com/watch?v=${esc(slide.id)}" target="_blank" rel="noopener">Ver en YouTube ↗</a>${nota}${aviso}`;
    }
    case 'sessions': {
      const items = SESSIONS.map(s=>`
        <div class="item">
          <div class="time">S${s.id}</div>
          <div class="txt"><h5>${esc(s.titulo)}</h5><p>${esc(fmtDate(CONFIG.SESSION_DATES[s.id-1]))}</p></div>
        </div>`).join('');
      return `<h3>${esc(slide.h||'Las 5 sesiones del programa')}</h3><div class="agenda">${items}</div>`;
    }
    default: return '';
  }
}
function renderSlideInline(slide){ return `<div class="slide-card">${slideBodyHtml(slide)}</div>`; }

/* YouTube exige un "referer" HTTP válido para reproducir un video incrustado.
   Un archivo abierto directamente desde el disco (file://) no envía ese dato y
   el reproductor devuelve el "Error 153". En ese caso abrimos el video en una
   pestaña nueva; publicado en http/https se reproduce dentro de la página. */
function canEmbedVideos(){
  return location.protocol === 'http:' || location.protocol === 'https:';
}
function bindVideoFacades(container){
  container.querySelectorAll('.video-facade').forEach(f=>{
    f.addEventListener('click', ()=>{
      const id = f.dataset.videoId;
      if(f.dataset.abreYoutube === '1'){
        window.open('https://www.youtube.com/watch?v=' + id, '_blank', 'noopener');
        return;
      }
      f.outerHTML = `<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="video" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
    });
  });
}

/* ---------- modo presentación (pantalla completa, navegación tipo PowerPoint) ---------- */
let presentState = null;
function startPresentation(slides, tag){
  presentState = {slides, idx:0, tag};
  document.addEventListener('keydown', presentKeyHandler);
  document.addEventListener('fullscreenchange', presentFsHandler);
  renderPresentOverlay(true);
}
function presentFsHandler(){
  if(presentState && !document.fullscreenElement){ closePresentation(); }
}
function closePresentation(){
  if(!presentState) return;
  presentState = null;
  document.removeEventListener('keydown', presentKeyHandler);
  document.removeEventListener('fullscreenchange', presentFsHandler);
  const el = document.getElementById('presentOverlay');
  if(el) el.remove();
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
function presentKeyHandler(e){
  if(!presentState) return;
  if(e.key==='Escape'){ closePresentation(); return; }
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); presentGo(1); }
  if(e.key==='ArrowLeft'){ presentGo(-1); }
}
function presentGo(delta){
  if(!presentState) return;
  const n = presentState.slides.length;
  presentState.idx = Math.min(n-1, Math.max(0, presentState.idx+delta));
  renderPresentOverlay(false);
}
function renderPresentOverlay(first){
  let el = document.getElementById('presentOverlay');
  if(!el){
    el = document.createElement('div');
    el.id = 'presentOverlay';
    el.className = 'present-overlay';
    document.body.appendChild(el);
  }
  if(first && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{ /* el navegador puede bloquear fullscreen; la superposición sigue funcionando igual */ });
  }
  const {slides, idx, tag} = presentState;
  const slide = slides[idx];
  const dots = slides.map((_,i)=>`<span class="pd ${i===idx?'active':''}"></span>`).join('');
  el.innerHTML = `
    <div class="present-top">
      <span class="ptag">${esc(tag)}</span>
      <div style="display:flex; align-items:center; gap:16px;">
        <img src="${LCG_LOGO_LIGHT}" alt="London Consulting Group" class="present-lcg-logo">
        <button class="present-close" id="presentCloseBtn">Salir (Esc)</button>
      </div>
    </div>
    <div class="present-body"><div class="present-slide">${slideBodyHtml(slide)}</div></div>
    <div class="present-bottom">
      <button class="present-nav-btn" id="presentPrev" ${idx===0?'disabled':''} aria-label="Anterior">‹</button>
      <div class="present-dots">${dots}</div>
      <button class="present-nav-btn" id="presentNext" ${idx===slides.length-1?'disabled':''} aria-label="Siguiente">›</button>
      <span class="present-counter">${idx+1} / ${slides.length}</span>
    </div>
  `;
  document.getElementById('presentCloseBtn').addEventListener('click', closePresentation);
  document.getElementById('presentPrev').addEventListener('click', ()=>presentGo(-1));
  document.getElementById('presentNext').addEventListener('click', ()=>presentGo(1));
  bindVideoFacades(el);
}

function buildSessionSlides(session){
  const slides = [];
  const focusTxt = (session.ladderFocus||[]).map(n=>LADDER.find(l=>l.n===n).nombre).join(', ');
  slides.push({type:'ladder', focus:session.ladderFocus, preview:session.ladderPreview,
    caption: focusTxt ? `Esta sesión trabaja de forma práctica: ${focusTxt}.` : 'Esta sesión es una demostración de visión, fuera del uso práctico diario.'});
  (session.contenido||[]).forEach(b=> slides.push({type:'content', h:b.h, p:b.p, ul:b.ul, tabla:b.tabla, ejemplo:b.ejemplo, icon:b.icon, clave:b.clave}));
  const vids = session.videos || (session.video ? [session.video] : []);
  vids.forEach(v=> slides.push({type:'video', id:v.id, titulo:v.titulo, nota:v.nota, embed:v.embed}));
  return slides;
}

/* ---------- Supabase (REST directo, sin dependencias externas) ---------- */
async function supaInsert(table, row){
  if(!SUPABASE_READY) throw new Error('Supabase no configurado todavía');
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}`, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apikey': CONFIG.SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + CONFIG.SUPABASE_ANON_KEY,
      'Prefer':'return=representation'
    },
    body: JSON.stringify(row)
  });
  if(!res.ok){ const t = await res.text(); throw new Error('Supabase insert falló: '+t); }
  return res.json();
}
async function supaSelect(table){
  if(!SUPABASE_READY) throw new Error('Supabase no configurado todavía');
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${table}?select=*&order=created_at.desc`, {
    headers:{ 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + CONFIG.SUPABASE_ANON_KEY }
  });
  if(!res.ok){ const t = await res.text(); throw new Error('Supabase select falló: '+t); }
  return res.json();
}
async function supaUploadFile(sessionSlug, file){
  if(!SUPABASE_READY) throw new Error('Supabase no configurado todavía');
  const path = `${sessionSlug}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9_.-]/g,'_')}`;
  const res = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/entregables/${path}`, {
    method:'POST',
    headers:{
      'apikey': CONFIG.SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + CONFIG.SUPABASE_ANON_KEY,
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if(!res.ok){ const t = await res.text(); throw new Error('Supabase storage falló: '+t); }
  return `${CONFIG.SUPABASE_URL}/storage/v1/object/public/entregables/${path}`;
}

    if(r.n===6){ cls+=' preview'; badge='<span class="badge">Solo referencia</span>'; }

function renderEjercicios(session){

    const pasos = (ej.pasos||[]).map(p=>`<li>${esc(p)}</li>`).join('');
    const promptId = `ej-prompt-${session.id}-${i}`;
    const promptBlock = ej.prompt ? `<div class="prompt-box">
      <div class="prompt-header">
        <span class="prompt-label">Prompt para copiar y pegar en Claude</span>
        <button class="copy-btn" data-pid="${esc(promptId)}">Copiar</button>

    <p style="font-size:13px; color:var(--ink-soft); margin-bottom:20px;">Practica durante la sesión en vivo o en cualquier momento después. Cada ejercicio incluye una guía paso a paso y un prompt listo para usar en Claude.</p>

  el.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const pid = btn.getAttribute('data-pid');
      const pre = document.getElementById(pid);
      if(!pre) return;
      const txt = pre.textContent;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(()=>{
          btn.textContent='¡Copiado!'; btn.classList.add('copied');
          setTimeout(()=>{ btn.textContent='Copiar'; btn.classList.remove('copied'); }, 2200);
        }).catch(fallback);
      } else { fallback(); }
      function fallback(){
        try{
          const r=document.createRange(); r.selectNodeContents(pre);
          const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
          document.execCommand('copy'); s.removeAllRanges();
          btn.textContent='¡Copiado!'; btn.classList.add('copied');
          setTimeout(()=>{ btn.textContent='Copiar'; btn.classList.remove('copied'); }, 2200);
        }catch(e){}
      }
    });
  });
}

/* ---------- Quiz ---------- */
function renderQuizCard(session){
  const el = document.getElementById('quizCard');
  const state = quizStateNow(session);

  const statusMap = {
    locked: {cls:'locked', txt:'Aún no disponible'},
    open: {cls:'open', txt:'Disponible ahora'},
    closed: {cls:'closed', txt:'Plazo cerrado'},
    done: {cls:'done', txt:'Ya lo respondiste en este dispositivo'}
  };
  const st = statusMap[state];

  let inner = `<div class="section-title"><span class="dot"></span><h3>Quiz de la Sesión ${session.id}</h3></div>
    <span class="quiz-status ${st.cls}">${st.txt}</span>`;

  if(state==='locked'){
    inner += `<p class="helptext">Este quiz se habilita automáticamente al terminar la sesión en vivo (${esc(fmtDate(sessionEnd(session)))}) y permanece abierto durante ${CONFIG.QUIZ_WINDOW_HOURS} horas.</p>`;
  } else if(state==='closed'){
    inner += `<p class="helptext">El plazo de ${CONFIG.QUIZ_WINDOW_HOURS} horas para responder este quiz ya terminó. Contacta a tu facilitador si necesitas una extensión.</p>`;
  } else if(state==='done'){
    inner += `<p class="helptext">Ya registramos tu respuesta desde este dispositivo. Si necesitas corregir algo, contacta a tu facilitador.</p>`;
  } else {
    const perfil = getPerfil();
    const puestoOpts = PUESTOS.map(p=>`<option value="${esc(p)}" ${perfil.puesto===p?'selected':''}>${esc(p)}</option>`).join('');
    const qs = session.quiz.map((q,i)=>`
      <div class="qcard">
        <div class="qtitle">${i+1}. ${esc(q.q)}</div>
        ${q.opts.map((o,j)=>`
          <label class="opt"><input type="radio" name="q${i}" value="${j}" required> <span>${esc(o)}</span></label>
        `).join('')}
      </div>`).join('');

    let entregableField = '';
    if(session.entregable){
      if(session.entregable.tipo==='file'){
        entregableField = `<div class="field"><label>${esc(session.entregable.etiqueta)}</label>
          <input type="file" id="entregableFile" accept="image/*,.pdf">
          <p class="helptext">${esc(session.entregable.ayuda)}</p></div>`;
      } else if(session.entregable.tipo==='texto'){
        entregableField = `<div class="field"><label>${esc(session.entregable.etiqueta)}</label>
          <textarea id="entregableTexto" placeholder="Escribe aquí..."></textarea>
          <p class="helptext">${esc(session.entregable.ayuda)}</p></div>`;
      } else if(session.entregable.tipo==='texto+file'){
        entregableField = `<div class="field"><label>${esc(session.entregable.etiqueta)}</label>
          <textarea id="entregableTexto" placeholder="Escribe aquí los pasos de tu propuesta..."></textarea>
          <input type="file" id="entregableFile" accept="image/*,.pdf" style="margin-top:8px;">
          <p class="helptext">${esc(session.entregable.ayuda)}</p></div>`;
      }
    }

    inner += `
      <form id="quizForm" style="margin-top:16px;">
        <div class="field"><label>Nombre completo</label><input type="text" id="fNombre" value="${esc(perfil.nombre)}" required></div>
        <div class="field"><label>Puesto</label><select id="fPuesto" required><option value="">Selecciona tu puesto</option>${puestoOpts}</select></div>
        ${qs}
        ${entregableField}
        <button class="btn" type="submit">Enviar y ver calificación</button>
        <div id="quizMsg" class="helptext"></div>
      </form>
      <div id="quizResult"></div>
    `;
  }
  el.innerHTML = inner;

  if(state==='open'){
    document.getElementById('quizForm').addEventListener('submit', (e)=>handleQuizSubmit(e, session));
  }
}

async function handleQuizSubmit(e, session){
  e.preventDefault();
  const form = e.target;
  const nombre = document.getElementById('fNombre').value.trim();
  const puesto = document.getElementById('fPuesto').value;
  if(!nombre || !puesto){ return; }
  setPerfil({nombre, puesto});

  let aciertos = 0;
  const respuestas = [];
  session.quiz.forEach((q,i)=>{
    const sel = form.querySelector(`input[name="q${i}"]:checked`);
    const val = sel ? parseInt(sel.value,10) : -1;
    const ok = val === q.correct;
    if(ok) aciertos++;
    respuestas.push({pregunta:q.q, seleccion:val, correcta:q.correct, ok});
  });
  const total = session.quiz.length;
  const porcentaje = Math.round((aciertos/total)*100);

  // entregable
  let entregable_texto = null, entregable_url = null;
  const tField = document.getElementById('entregableTexto');
  if(tField) entregable_texto = tField.value.trim();
  const fField = document.getElementById('entregableFile');

  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Enviando...';
  const msg = document.getElementById('quizMsg');

  try{
    if(fField && fField.files && fField.files[0]){
      entregable_url = await supaUploadFile(session.slug, fField.files[0]);
    }
    await supaInsert(`quiz_sesion_${session.id}`, {
      nombre, puesto,
      respuestas,
      aciertos, total, porcentaje,
      entregable_texto, entregable_url
    });
    msg.textContent = '';
  }catch(err){
    console.warn('No se pudo guardar en Supabase:', err.message);
    msg.textContent = SUPABASE_READY
      ? 'Tu calificación se muestra abajo, pero hubo un problema guardándola en el servidor. Toma una captura de pantalla por seguridad.'
      : 'Supabase todavía no está conectado en esta copia del archivo — tu calificación se muestra abajo, pero no se guardó en ningún servidor.';
  }

  localStorage.setItem('kia_done_'+session.id, '1');

  const resultDiv = document.getElementById('quizResult');
  const low = porcentaje < 60;
  resultDiv.innerHTML = `
    <div class="result-panel ${low?'low':''}">
      <div class="score">${porcentaje}<small>%</small></div>
      <p>${aciertos} de ${total} respuestas correctas</p>
      <div class="review">
        ${respuestas.map((r,i)=>`
          <div class="ritem">
            <span class="${r.ok?'ok':'bad'}">${r.ok?'✔':'✘'}</span>
            <span>${esc(r.pregunta)}${r.ok?'':` — respuesta correcta: “${esc(session.quiz[i].opts[session.quiz[i].correct])}”`}</span>
          </div>`).join('')}
      </div>
    </div>
  `;
  form.style.display = 'none';
}

/* ---------- Admin ---------- */
function renderAdmin(){
  const isAuth = sessionStorage.getItem('kia_admin')==='1';
  if(!isAuth){
    $app.innerHTML = `
      <div class="card" style="max-width:420px; margin:40px auto;">
        <div class="section-title"><span class="dot"></span><h3>Panel de administrador</h3></div>
        <p style="font-size:13.5px; color:var(--ink-soft);">Acceso restringido al equipo de IMPULSA / LCG y a KRAM.</p>
        <div class="field"><label>Clave de acceso</label><input type="text" id="adminPass"></div>
        <button class="btn" id="adminGo">Entrar</button>
        <p class="helptext" style="margin-top:14px;">Nota de seguridad: esta clave es una barrera básica del lado del navegador, no un control de acceso real. Para un panel de administrador con seguridad de nivel producción, se recomienda añadir autenticación de Supabase (Auth) y reglas de RLS que limiten la lectura de resultados solo a usuarios autenticados como administradores.</p>
      </div>`;
    document.getElementById('adminGo').addEventListener('click', ()=>{
      if(document.getElementById('adminPass').value === CONFIG.ADMIN_PASSCODE){
        sessionStorage.setItem('kia_admin','1');
        renderAdmin();
      } else {
        alert('Clave incorrecta.');
      }
    });
    return;
  }

  if(!SUPABASE_READY){
    $app.innerHTML = `
      <div class="banner warn">
        Este archivo todavía no está conectado a un proyecto de Supabase. Edita <code>CONFIG.SUPABASE_URL</code> y <code>CONFIG.SUPABASE_ANON_KEY</code> al inicio del archivo, crea las tablas indicadas abajo, y este panel se llenará automáticamente con los resultados reales.
      </div>
      ${renderSqlBlock()}
    `;
    return;
  }

  $app.innerHTML = `<div class="card"><p>Cargando resultados desde Supabase…</p></div>`;
  loadAdminData();
}

function renderSqlBlock(){
  const sql = `-- Ejecuta esto una vez en el SQL Editor de tu proyecto Supabase
-- (Project Settings > API te da la URL y la anon key para pegar en CONFIG)

create extension if not exists pgcrypto;

${SESSIONS.map(s=>`create table if not exists quiz_sesion_${s.id} (
  id uuid primary key default gen_random_uuid(),
  created_at timestamptz default now(),
  nombre text not null,
  puesto text not null,
  respuestas jsonb not null,
  aciertos int not null,
  total int not null,
  porcentaje numeric not null,
  entregable_texto text,
  entregable_url text
);
alter table quiz_sesion_${s.id} enable row level security;
create policy "insertar_publico" on quiz_sesion_${s.id} for insert to anon with check (true);
create policy "leer_publico" on quiz_sesion_${s.id} for select to anon using (true);
`).join('\n')}
-- Bucket de Storage para los entregables (crear manualmente en Storage > New Bucket):
-- nombre: entregables · público: sí (o usa URLs firmadas si prefieres privacidad)`;
  return `<div class="card">
    <div class="section-title"><span class="dot"></span><h3>SQL para crear las tablas en Supabase</h3></div>
    <p style="font-size:13px; color:var(--ink-soft);">La política "leer_publico" permite que este panel lea resultados usando la misma llave pública (anon) del formulario. Es una simplificación válida para una primera versión interna; si más adelante quieres restringir la lectura solo a administradores autenticados, cámbiala por una política basada en Supabase Auth.</p>
    <pre style="white-space:pre-wrap; background:#F3F2EE; padding:16px; border-radius:10px; font-size:12px; overflow-x:auto;">${esc(sql)}</pre>
  </div>`;
}

async function loadAdminData(){
  try{
    const results = await Promise.all(SESSIONS.map(s => supaSelect(`quiz_sesion_${s.id}`).catch(()=>[])));
    renderAdminDashboard(results);
  }catch(err){
    $app.innerHTML = `<div class="banner warn">No se pudieron cargar los resultados: ${esc(err.message)}</div>${renderSqlBlock()}`;
  }
}

function renderAdminDashboard(results){
  const roster = JSON.parse(localStorage.getItem('kia_roster')||'[]');

  const totalRespuestas = results.reduce((a,r)=>a+r.length,0);
  const promedios = results.map(r => r.length ? Math.round(r.reduce((a,x)=>a+Number(x.porcentaje||0),0)/r.length) : null);
  const promedioGlobal = (()=>{ const vals = promedios.filter(v=>v!=null); return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0; })();
  const entregablesRecibidos = results.reduce((a,r)=>a + r.filter(x=>x.entregable_texto || x.entregable_url).length, 0);

  let statRow = `<div class="stat-row">
    <div class="stat"><div class="v">${totalRespuestas}</div><div class="l">Respuestas totales (5 sesiones)</div></div>
    <div class="stat"><div class="v">${promedioGlobal}%</div><div class="l">Calificación promedio global</div></div>
    <div class="stat"><div class="v">${entregablesRecibidos}</div><div class="l">Entregables recibidos</div></div>
    <div class="stat"><div class="v">${roster.length || '—'}</div><div class="l">Participantes en lista maestra</div></div>
  </div>`;

  let rosterCard = `
    <div class="card" style="margin-bottom:24px;">
      <div class="section-title"><span class="dot"></span><h3>Lista maestra de participantes</h3></div>
      <p style="font-size:13px; color:var(--ink-soft);">Pega aquí un CSV con columnas <code>nombre,puesto</code> (una persona por línea) para calcular el % de respuesta y quiénes faltan por sesión. Se guarda solo en este navegador.</p>
      <textarea id="rosterInput" placeholder="Nombre Apellido,Promotor(a)&#10;Otra Persona,Supervisor(a) de Promotoría">${esc((JSON.parse(localStorage.getItem('kia_roster_raw')||'""'))||'')}</textarea>
      <button class="btn secondary" id="rosterSave" style="margin-top:10px;">Guardar lista</button>
    </div>`;

  let sessionCards = SESSIONS.map((s,i)=>{
    const rows = results[i];
    const respondieron = new Set(rows.map(r=>(r.nombre||'').trim().toLowerCase()));
    const faltantes = roster.filter(p => !respondieron.has((p.nombre||'').trim().toLowerCase()));
    const pctResp = roster.length ? Math.round((respondieron.size/roster.length)*100) : null;

    const tableRows = rows.map(r=>{
      const pct = Math.round(Number(r.porcentaje||0));
      const cls = pct>=80?'high':(pct>=50?'mid':'low');
      const entregable = r.entregable_url ? `<a href="${esc(r.entregable_url)}" target="_blank" rel="noopener">Ver archivo</a>` : (r.entregable_texto ? esc(r.entregable_texto).slice(0,60)+'…' : '—');
      return `<tr>
        <td>${esc(r.nombre)}</td>
        <td>${esc(r.puesto)}</td>
        <td><span class="badge-pct ${cls}">${pct}%</span></td>
        <td>${r.aciertos}/${r.total}</td>
        <td>${entregable}</td>
        <td>${r.created_at ? new Date(r.created_at).toLocaleString('es-MX') : '—'}</td>
      </tr>`;
    }).join('');

    return `
      <div class="card" style="margin-bottom:20px;">
        <div class="section-title"><span class="dot"></span><h3>Sesión ${s.id} — ${esc(s.titulo)}</h3></div>
        <p style="font-size:13px; color:var(--ink-soft);">
          ${rows.length} respuesta(s)${pctResp!=null ? ` · ${pctResp}% de la lista maestra respondió` : ''}
        </p>
        ${faltantes.length ? `<p style="font-size:12.5px; color:var(--rojo); margin-bottom:14px;"><strong>Faltan por responder (${faltantes.length}):</strong> ${faltantes.map(f=>esc(f.nombre)).join(', ')}</p>` : ''}
        <div class="table-scroll">
        <table class="datatable">
          <thead><tr><th>Nombre</th><th>Puesto</th><th>%</th><th>Aciertos</th><th>Entregable</th><th>Fecha</th></tr></thead>
          <tbody>${tableRows || '<tr><td colspan="6" style="color:var(--ink-soft);">Sin respuestas todavía.</td></tr>'}</tbody>
        </table>
        </div>
      </div>`;
  }).join('');

  $app.innerHTML = `
    <div class="section-title"><span class="dot"></span><h3>Panel de administrador — vista global</h3></div>
    ${statRow}
    ${rosterCard}
    ${sessionCards}
  `;

  document.getElementById('rosterSave').addEventListener('click', ()=>{
    const raw = document.getElementById('rosterInput').value;
    const rows = raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const [nombre, puesto] = l.split(',');
      return {nombre:(nombre||'').trim(), puesto:(puesto||'').trim()};
    });
    localStorage.setItem('kia_roster', JSON.stringify(rows));
    localStorage.setItem('kia_roster_raw', JSON.stringify(raw));
    renderAdminDashboard(results);
  });
}

/* ---------- Router ---------- */
function route(){
  renderNav();
  const hash = (location.hash || '#inicio').replace('#','');
  if(hash === 'inicio' || hash===''){ renderHome(); return; }
  if(hash === 'admin'){ renderAdmin(); return; }
  const session = SESSIONS.find(s=>s.slug===hash);
  if(session){ renderSession(session); return; }
  renderHome();
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);
